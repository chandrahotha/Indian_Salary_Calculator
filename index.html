const INR2 = new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2});
function fmt(n,frac){ if(!isFinite(n)) return '—'; return (frac? INR2:INR).format(Math.round(n*100)/100); }
function fmtCompact(n){
  if(!isFinite(n)) return '—';
  const a=Math.abs(n);
  if(a>=10000000) return (n/10000000).toFixed(2).replace(/\.00$/,'')+' Cr';
  if(a>=100000) return (n/100000).toFixed(2).replace(/\.00$/,'')+' L';
  return fmt(n,false);
}
function isValidNumber(n){ return typeof n==='number' && isFinite(n) && !isNaN(n); }
function clampNum(n,min,max){ n=Number(n); if(!isValidNumber(n)) n=min; return Math.min(max,Math.max(min,n)); }
function round2(n){ return Math.round((n+Number.EPSILON)*100)/100; }
function safeDiv(a,b){ return b? a/b : 0; }
function uid(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
/* Indian digit grouping: 1800000 -> "18,00,000". Display only; state keeps the number. */
function inrGroup(n){
  const s = String(Math.round(Math.abs(Number(n)||0)));
  if(s.length<=3) return s;
  const last3 = s.slice(-3);
  const rest = s.slice(0,-3);
  return rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + last3;

  'Tamil Nadu': { status:CONF.UNVERIFIED, halfYearly:true, slabs:[{min:0,max:21000,amt:0},{min:21000,max:30000,amt:135},{min:30000,max:45000,amt:315},{min:45000,max:60000,amt:690},{min:60000,max:75000,amt:1025},{min:75000,max:Infinity,amt:1250}], cap:2500,
    note:'Tamil Nadu collects this twice a year, not monthly. The top rate is reported as either ₹1,200 or ₹1,250, so this figure is approximate.' },
  'Gujarat': { status:CONF.UNVERIFIED, slabs:[{min:0,max:12000,amt:0},{min:12000,max:Infinity,amt:200}], cap:2400, note:'This rate has not been confirmed against an official Gujarat source. Check your payslip before relying on it.' },
  'Madhya Pradesh': { status:CONF.UNVERIFIED, slabs:[{min:0,max:225000/12,amt:0},{min:225000/12,max:Infinity,amt:208}], cap:2500, note:'This rate has not been confirmed against an official Madhya Pradesh source. Check your payslip before relying on it.' },
  'Kerala': { status:CONF.UNVERIFIED, halfYearly:true, slabs:[{min:0,max:12000,amt:0},{min:12000,max:Infinity,amt:1250}], cap:2500, note:'Kerala has several half-yearly slabs. This is a simplified version, so treat the figure as approximate.' }
};

function stateOptionList(){
  return Object.keys(PT_STATES).concat(PT_NOT_LEVIED, PT_UNCERTAIN, PT_UNMAPPED)
    .sort((a,b)=>a.localeCompare(b));
}

/* ---------- generic slab tax helper (shared — never duplicate formulas) ---------- */
function slabTax(taxableIncome, slabs){
  let tax=0; const rows=[];
  for(const s of slabs){
    if(taxableIncome>s.min){
      const amtInSlab = Math.min(taxableIncome,s.max)-s.min;
      const taxInSlab = amtInSlab*s.rate;
      tax += taxInSlab;
      rows.push({min:s.min,max:s.max,rate:s.rate,taxable:amtInSlab,tax:taxInSlab});
    }
  }
  return {tax, rows};
}

/* 87A rebate with marginal relief near the threshold (new-regime style). */
function calculateRebate(baseTax, taxableIncome, regimeRules){
  const {rebateThreshold, rebateMax, marginalReliefZone} = regimeRules;
  if(taxableIncome<=rebateThreshold){
    const rebate = Math.min(baseTax, rebateMax);
    return {rebate, marginalRelief:0};
  }
  if(marginalReliefZone){
    const excess = taxableIncome - rebateThreshold;
    if(baseTax > excess){
      const relief = baseTax - excess;
      return {rebate: round2(relief), marginalRelief: round2(relief)};
    }
  }
  return {rebate:0, marginalRelief:0};
}

/* Surcharge with marginal relief: tax+surcharge after crossing a threshold must
   never exceed (tax at the threshold) + (income beyond the threshold). */
function calculateSurcharge(taxAfterRebate, totalIncome, bands, computeBaseTaxAt){
  let rate=0, thresholdUsed=0;
  for(const b of bands){ if(totalIncome>b.threshold){ rate=b.rate; thresholdUsed=b.threshold; } }
  if(rate===0) return {rate:0, surcharge:0, marginalRelief:0};
  const rawSurcharge = taxAfterRebate*rate;
  const taxAtThreshold = computeBaseTaxAt(thresholdUsed);
  const maxAllowed = taxAtThreshold + (totalIncome - thresholdUsed);
  const totalWithSurcharge = taxAfterRebate + rawSurcharge;
  let marginalRelief=0, surcharge=rawSurcharge;
  if(totalWithSurcharge > maxAllowed){
    marginalRelief = totalWithSurcharge - maxAllowed;
    surcharge = rawSurcharge - marginalRelief;
  }
  return {rate, surcharge: round2(surcharge), marginalRelief: round2(marginalRelief)};
}

function calculateCess(amount, rate){ return round2(amount*rate); }

/* Full regime computation: taxableIncome -> {slabRows, baseTax, rebate, marginalReliefRebate,
   taxAfterRebate, surchargeRate, surcharge, marginalReliefSurcharge, cess, totalTax} */
function calculateRegimeTax(taxableIncome, regimeRules){
  taxableIncome = Math.max(0, round2(taxableIncome));
  const {tax:baseTax, rows} = slabTax(taxableIncome, regimeRules.slabs);
  const {rebate, marginalRelief:mrRebate} = calculateRebate(baseTax, taxableIncome, regimeRules);
  const taxAfterRebate = Math.max(0, round2(baseTax - rebate));
  const computeBaseTaxAt = (inc)=> slabTax(inc, regimeRules.slabs).tax;
  const sur = calculateSurcharge(taxAfterRebate, taxableIncome, regimeRules.surcharge, computeBaseTaxAt);
  const taxWithSurcharge = round2(taxAfterRebate + sur.surcharge);
  const cess = calculateCess(taxWithSurcharge, regimeRules.cess);
  const totalTax = round2(taxWithSurcharge + cess);
  return {
    taxableIncome, slabRows:rows, baseTax:round2(baseTax),
    rebate:round2(rebate), marginalReliefRebate:mrRebate,
    taxAfterRebate, surchargeRate:sur.rate, surcharge:sur.surcharge, marginalReliefSurcharge:sur.marginalRelief,
    taxWithSurcharge, cess, totalTax
  };
}
function calculateOldRegimeTax(taxableIncome, fyRules){ return calculateRegimeTax(taxableIncome, fyRules.old); }
function calculateNewRegimeTax(taxableIncome, fyRules){ return calculateRegimeTax(taxableIncome, fyRules.new); }

/* ---------- HRA exemption ---------- */
function calculateHRAExemption({basicPlusDA, hraReceived, rentPaid, isMetro}){
  basicPlusDA=Math.max(0,basicPlusDA); hraReceived=Math.max(0,hraReceived); rentPaid=Math.max(0,rentPaid);
  const a = hraReceived;
  const b = Math.max(0, rentPaid - 0.10*basicPlusDA);
  const c = (isMetro?HRA_RULES.metroPercent:HRA_RULES.nonMetroPercent)*basicPlusDA;
  const exemption = Math.min(a,b,c);
  return { a, b, c, exemption: round2(Math.max(0,exemption)) };
}

/* ---------- PF ---------- */
function calculateEmployeePF(basicPlusDA, opts){
  opts = opts||{};
  basicPlusDA = Math.max(0, basicPlusDA);
  const base = opts.ignoreCeiling ? basicPlusDA : Math.min(basicPlusDA, PF_RULES.wageCeiling);
  /* Some employers deduct a flat monthly PF (for example ₹1,800) instead of 12%
     of the wage base. A valid fixedMonthly overrides the statutory figure. */
  const fixed = isValidNumber(opts.fixedMonthly) ? Math.max(0, opts.fixedMonthly) : null;
  const statutory = fixed!=null ? round2(fixed) : round2(base*PF_RULES.employeeRate);
  const vpf = round2(opts.vpfPercent? basicPlusDA*(opts.vpfPercent/100) : 0);
  return { wageBase:base, statutory, vpf, total: round2(statutory+vpf), fixed: fixed!=null };
}
function calculateEmployerPF(basicPlusDA, opts){
  opts = opts||{};
  basicPlusDA = Math.max(0, basicPlusDA);
  const base = opts.ignoreCeiling ? basicPlusDA : Math.min(basicPlusDA, PF_RULES.wageCeiling);
  const fixed = isValidNumber(opts.fixedMonthly) ? Math.max(0, opts.fixedMonthly) : null;
  const totalEmployer = fixed!=null ? round2(fixed) : round2(base*0.12);
  const epsFinal = round2(Math.min(base*PF_RULES.employerEpsShare, PF_RULES.epsMaxMonthly, totalEmployer));
  const epfFinal = round2(Math.max(0, totalEmployer - epsFinal));
  return { wageBase:base, eps:epsFinal, epf:epfFinal, total: totalEmployer, fixed: fixed!=null };
}

/* ---------- ESI ---------- */
function calculateESI(grossMonthly, opts){
  opts = opts||{};  const eligible = grossMonthly <= ESI_RULES.wageCeiling || (opts.disabled && grossMonthly<=ESI_RULES.wageCeilingDisabled);
  if(!eligible) return { eligible:false, employee:0, employer:0, total:0 };
  const dailyWage = grossMonthly/30;
  const employeeExempt = dailyWage <= ESI_RULES.lowWageExemptionDailyWage;
  const employee = employeeExempt? 0 : round2(grossMonthly*ESI_RULES.employeeRate);
  const employer = round2(grossMonthly*ESI_RULES.employerRate);
  return { eligible:true, employeeExempt, employee, employer, total: round2(employee+employer) };
}

/* ---------- Professional tax ---------- */
function calculateProfessionalTax(stateName, grossMonthly, opts){
  opts=opts||{};
  if(opts.customMonthly!=null && isValidNumber(opts.customMonthly)){
    return { source:'user-override', status:CONF.CONFIGURABLE, monthly: Math.max(0,opts.customMonthly), annual: Math.max(0,opts.customMonthly)*12 };
  }
  if(PT_NOT_LEVIED.includes(stateName)){
    return { source:'state-not-levied', status:CONF.VERIFIED, monthly:0, annual:0 };
  }
  const rule = PT_STATES[stateName];
  if(!rule){
    return { source:'unavailable', status:CONF.UNVERIFIED, monthly:0, annual:0,
      note: PT_UNCERTAIN.includes(stateName)
        ?'Whether this state levies PT is itself unconfirmed — enter a manual amount if known.'
        :(PT_UNMAPPED.includes(stateName)
          ?'Professional tax rates for this state are not in the built-in table. Enter the monthly amount from your payslip in the override below.'
          :'No verified slab data for this state — enter a manual amount if known.') };
  }
  let base = grossMonthly;
  let amt=0;
  for(const s of rule.slabs){ if(base>s.min) amt = s.amt; }
  /* `amt` is the per-collection amount. Half-yearly states collect it twice a year,
     so the monthly equivalent is amt/6 — not amt. Reporting amt as "monthly" made
     the monthly figure contradict the annual one. */
  let monthly, annual;
  if(rule.halfYearly){
    annual = Math.min(amt*2, rule.cap || PT_STATUTORY_ANNUAL_CAP);
  } else if(rule.annualTopUpMonth){
    annual = Math.min(amt*11 + rule.annualTopUpAmt, rule.cap || PT_STATUTORY_ANNUAL_CAP);
  } else {
    annual = Math.min(amt*12, rule.cap || PT_STATUTORY_ANNUAL_CAP);
  }
  // Derived, not rounded: monthly x 12 must reproduce the annual figure exactly.
  monthly = annual/12;
  return { source:'state-table', status:rule.status, monthly, annual, note:rule.note||null, halfYearly:!!rule.halfYearly };
}

/* ---------- Gratuity ---------- */
function calculateGratuity({basicPlusDA, yearsOfService, coveredUnderAct}){
  basicPlusDA=Math.max(0,basicPlusDA); yearsOfService=Math.max(0,yearsOfService);
  const eligible = yearsOfService >= GRATUITY_RULES.minServiceYears;
  const divisor = coveredUnderAct ? GRATUITY_RULES.divisorCovered : GRATUITY_RULES.divisorNotCovered;
  const roundedYears = coveredUnderAct ? Math.round(yearsOfService) : Math.floor(yearsOfService);
  const gross = round2((basicPlusDA*15*roundedYears)/divisor);
  const exempt = Math.min(gross, GRATUITY_RULES.exemptionCeiling);
  const taxable = Math.max(0, round2(gross-exempt));
  return { eligible, roundedYears, divisor, gross, exempt, taxable };
}

/* ---------- Leave encashment ---------- */
function calculateLeaveEncashment({avgMonthlySalary, leaveDaysEncashed, yearsOfService, isGovernment, atRetirement, priorExemptionClaimed}){
  avgMonthlySalary=Math.max(0,avgMonthlySalary);
  const amountReceived = round2((avgMonthlySalary/30)*Math.max(0,leaveDaysEncashed));
  if(isGovernment && atRetirement){
    return { amountReceived, exempt: amountReceived, taxable: 0, basis:'government-fully-exempt' };
  }
  if(!atRetirement){
    return { amountReceived, exempt:0, taxable: amountReceived, basis:'during-service-fully-taxable' };
  }
  const capDays = Math.min(leaveDaysEncashed, LEAVE_ENCASHMENT_RULES.maxLeaveDaysPerYear*Math.max(1,yearsOfService));
  const cashEquivalent = round2((avgMonthlySalary/30)*capDays);
  const tenMonthAvg = round2(avgMonthlySalary*LEAVE_ENCASHMENT_RULES.maxAvgMonths);
  const remainingCeiling = Math.max(0, LEAVE_ENCASHMENT_RULES.exemptionCeiling - Math.max(0,priorExemptionClaimed||0));
  const exempt = Math.max(0, Math.min(amountReceived, cashEquivalent, tenMonthAvg, remainingCeiling));
  const taxable = Math.max(0, round2(amountReceived-exempt));
  return { amountReceived, exempt: round2(exempt), taxable, basis:'10(10AA)(ii)', components:{cashEquivalent,tenMonthAvg,remainingCeiling} };
}

/* ---------- CTC-first derivation ----------
   The user's entry point is one number: annual CTC. This turns that number into a
   complete, internally consistent salary structure, so nothing has to be
   hand-computed before the app can say anything useful.

   Order matters and is deliberate:
     1. basic = basicPercent of CTC (the conventional 40-50% anchor)
     2. HRA   = 50% of basic in a metro, 40% elsewhere (the Sec 10(13A) benchmark)
     3. employer PF on that basic, at the statutory 12%
     4. special allowance = the balancing figure, so CTC reconciles exactly
   The result is a structure whose modeled CTC equals the entered CTC by
   construction — no phantom reconciliation warning on first load. */
function deriveStructureFromCTC(annualCTC, opts){
  opts = opts || {};
  annualCTC = Math.max(0, Number(annualCTC) || 0);
  const basicPercent = clampNum(opts.basicPercent==null?40:opts.basicPercent, 10, 70) / 100;
  const isMetro = opts.isMetro !== false;
  const bonus = Math.max(0, Number(opts.bonus) || 0);
  const ignoreCeiling = opts.pfIgnoreCeiling !== false;

  const basicAnnual = round2(annualCTC * basicPercent);
  const basicMonthly = round2(basicAnnual / 12);
  const hraMonthly = round2(basicMonthly * (isMetro ? HRA_RULES.metroPercent : HRA_RULES.nonMetroPercent));

  const erPF = calculateEmployerPF(basicMonthly, { ignoreCeiling });
  const erPFAnnual = round2(erPF.total * 12);
  const erNPSAnnual = round2(basicAnnual * ((Number(opts.employerNpsPercent) || 0) / 100));

  // Special allowance absorbs whatever is left after basic, HRA and employer costs.
  const residualAnnual = round2(annualCTC - basicAnnual - round2(hraMonthly*12) - erPFAnnual - erNPSAnnual - bonus);
  const specialMonthly = round2(Math.max(0, residualAnnual) / 12);

  return {
    basic: basicMonthly,
    hra: hraMonthly,
    specialAllowance: specialMonthly,
    bonus,
    basicPercent: Math.round(basicPercent*100),
    residualAnnual,
    // true when the basic% chosen leaves no room for an allowance at all
    overAllocated: residualAnnual < 0
  };
}

/* ---------- bonus timing ----------
   Organisations pay variable pay differently: one lump in January, one lump in
   March, or split across two months. The schedule is an input, not an assumption,
   because it changes which month's take-home is large — and therefore what the
   payslip and TDS look like month to month. */
const MONTH_LABELS = ['Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb','Mar'];

function clampMonthIndex(v){
  const n = Math.round(Number(v));
  if(!isValidNumber(n)) return 0;
  return Math.min(11, Math.max(0, n));
}

/* Returns 12 amounts (Apr..Mar) summing exactly to totalBonus. The first
   instalment share is an input so a 60/40 or 70/30 split can be modeled, not
   only a 50/50 one. Defaults to 50% if the input is missing (old scenarios). */
function buildBonusSchedule(totalBonus, installments, month1, month2, firstSharePct){
  const total = Math.max(0, Number(totalBonus) || 0);
  const arr = new Array(12).fill(0);
  if(total <= 0) return arr;
  const m1 = clampMonthIndex(month1);
  if(Number(installments) === 2){
    const m2 = clampMonthIndex(month2);
    const rawShare = Number(firstSharePct);
    const share = isValidNumber(rawShare) ? Math.min(100, Math.max(0, rawShare)) / 100 : 0.5;
    const first = round2(total * share);
    arr[m1] = round2(arr[m1] + first);
    arr[m2] = round2(arr[m2] + (total - first)); // remainder to the second month, so the total is exact
  } else {
    arr[m1] = total;
  }
  return arr;
}

/* Spreads a total tax figure across months in proportion to the bonus received,
   assigning any rounding remainder to the last month that received a bonus. */
function allocateProRata(total, weights){
  const sumW = weights.reduce((a,b)=>a+b,0);
  const out = new Array(weights.length).fill(0);
  if(sumW <= 0 || total <= 0) return out;
  let allocated = 0, lastIdx = -1;
  weights.forEach((w,i)=>{
    if(w > 0){
      out[i] = round2(total * (w/sumW));
      allocated = round2(allocated + out[i]);
      lastIdx = i;
    }
  });
  if(lastIdx >= 0) out[lastIdx] = round2(out[lastIdx] + (total - allocated));
  return out;
}

/* ---------- Salary structure reconciliation ---------- */
function buildSalaryStructure(inputs){
  const basic = Math.max(0, inputs.basic||0);
  const da = Math.max(0, inputs.da||0);
  const hra = Math.max(0, inputs.hra||0);
  const specialAllowance = Math.max(0, inputs.specialAllowance||0);
  const lta = Math.max(0, inputs.lta||0);
  const otherAllowances = Math.max(0, inputs.otherAllowances||0);
  const bonus = Math.max(0, inputs.bonus||0);

  const basicPlusDA = basic+da;
  const empPF = calculateEmployeePF(basicPlusDA, {ignoreCeiling:inputs.pfIgnoreCeiling, vpfPercent:inputs.vpfPercent, fixedMonthly:inputs.pfEmployeeMonthly});
  const erPF = calculateEmployerPF(basicPlusDA, {ignoreCeiling:inputs.pfIgnoreCeiling, fixedMonthly:inputs.pfEmployerMonthly});
  const erNPS = round2(basicPlusDA*((inputs.employerNpsPercent||0)/100));
  const gratuityProvision = round2((basicPlusDA*15)/26/12*0); // informational only unless user requests; default 0 to avoid inventing a provisioning policy
  const insurance = Math.max(0, inputs.employerInsurance||0);

  const grossMonthly = basic+da+hra+specialAllowance+lta+otherAllowances;
  const ctcMonthly = grossMonthly + erPF.total + erNPS + insurance;
  const ctcAnnual = round2(ctcMonthly*12 + bonus);
  const enteredCTC = inputs.enteredAnnualCTC!=null? inputs.enteredAnnualCTC : null;
  const reconciliationDiff = enteredCTC!=null? round2(enteredCTC - ctcAnnual) : 0;

  return {
    components:{basic,da,hra,specialAllowance,lta,otherAllowances,bonus},
    basicPlusDA, empPF, erPF, erNPS, insurance,
    grossMonthly: round2(grossMonthly), grossAnnual: round2(grossMonthly*12+bonus),
    ctcMonthly: round2(ctcMonthly), ctcAnnual, enteredCTC, reconciliationDiff
  };
}

/* ---------- Take-home / employer cost ---------- */
function calculateTakeHomeSalary({grossMonthly, employeePF, professionalTaxMonthly, monthlyTDS, esiEmployee, otherDeductions}){
  const total = Math.max(0,employeePF||0)+Math.max(0,professionalTaxMonthly||0)+Math.max(0,monthlyTDS||0)+Math.max(0,esiEmployee||0)+Math.max(0,otherDeductions||0);
  return round2(Math.max(0, grossMonthly-total));
}
function calculateEmployerCost({ctcAnnual, extraEmployerCosts}){
  return round2(ctcAnnual + Math.max(0,extraEmployerCosts||0));
}
function calculateMonthlyTDS(annualTax, monthsRemaining){
  monthsRemaining = clampNum(monthsRemaining,1,12);
  return round2(annualTax/monthsRemaining);
}
function calculateAnnualTaxLiability(regimeResult, tdsAlreadyDeducted){
  const liability = regimeResult.totalTax;
  const remaining = round2(liability - Math.max(0,tdsAlreadyDeducted||0));
  return { liability, tdsAlreadyDeducted: Math.max(0,tdsAlreadyDeducted||0), remaining };
}

/* ---------- Salary hike ---------- */
function calculateSalaryHike(currentCTC, newCTC){
  currentCTC=Math.max(0,currentCTC); newCTC=Math.max(0,newCTC);
  const diff = round2(newCTC-currentCTC);
  const pct = currentCTC? round2((diff/currentCTC)*100) : 0;
  return { diff, pct };
}

/* ---------- Freelancer / presumptive taxation (Sec 44ADA) ---------- */
const FREELANCE_RULES = {
  status: CONF.CONFIGURABLE, source:'Sec 44ADA presumptive taxation for specified professions',
  presumptiveRate:0.50, turnoverLimit:7500000,
  note:'44ADA applies only to specified professions and within the turnover limit; GST registration threshold (₹20L services / ₹40L goods, varies by state) is not auto-applied — verify applicability.'
};
function calculateFreelanceIncome({grossReceipts, actualExpenses, usePresumptive}){
  grossReceipts=Math.max(0,grossReceipts); actualExpenses=Math.max(0,actualExpenses);
  const eligible44ADA = grossReceipts<=FREELANCE_RULES.turnoverLimit;
  let professionalIncome;
  if(usePresumptive && eligible44ADA){
    professionalIncome = round2(grossReceipts*FREELANCE_RULES.presumptiveRate);
  } else {
    professionalIncome = Math.max(0, round2(grossReceipts-actualExpenses));
  }
  return { grossReceipts, actualExpenses, eligible44ADA, professionalIncome, mode: (usePresumptive&&eligible44ADA)?'presumptive':'actual' };
}

/* ---------- Scenario persistence ---------- */
const STORAGE_KEY='indiaSalaryCalc.scenarios.v1';
const STORAGE_SCHEMA_VERSION=1;
function storageAvailable(){
  try{ const k='__t'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }catch(e){ return false; }
}
function loadScenarios(){
  if(!storageAvailable()) return [];
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return [];
    const parsed = JSON.parse(raw);
    if(!Array.isArray(parsed)) return [];
    return parsed.filter(validateScenarioShape);
  }catch(e){ return []; }
}
function saveScenarios(list){
  if(!storageAvailable()) return false;
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); return true; }catch(e){ return false; }
}
function validateScenarioShape(s){
  return s && typeof s==='object' && typeof s.id==='string' && typeof s.name==='string' && typeof s.inputs==='object' && s.inputs!==null;
}
function exportScenarioJSON(scenario){
  return JSON.stringify({ schemaVersion:STORAGE_SCHEMA_VERSION, exportedAt:new Date().toISOString(), scenario }, null, 2);
}
function importScenarioJSON(text){
  let data;
  try{ data = JSON.parse(text); } catch(e){ return { ok:false, error:'File is not valid JSON.' }; }
  if(!data || typeof data!=='object') return { ok:false, error:'Unexpected file structure.' };
  const scenario = data.scenario || data;
  if(!validateScenarioShape({...scenario, id: scenario.id||'x', name: scenario.name||'x'})) {
    // allow missing id/name by generating them, but inputs must exist and be sane
  }
  if(!scenario.inputs || typeof scenario.inputs!=='object') return { ok:false, error:'Missing or invalid "inputs" object.' };
  for(const k of Object.keys(scenario.inputs)){
    const v = scenario.inputs[k];
    const defaultVal = AppState.inputs[k];
    if(typeof defaultVal==='number' && v!=null && (typeof v!=='number' || !isValidNumber(v))){
      return { ok:false, error:`Field "${k}" must be a valid number.` };
    }
    if(typeof defaultVal==='boolean' && v!=null && typeof v!=='boolean'){
      return { ok:false, error:`Field "${k}" must be true/false.` };
    }
  }
  const safe = { id: typeof scenario.id==='string'? scenario.id: uid(), name: typeof scenario.name==='string'&&scenario.name.trim()? scenario.name.trim():'Imported scenario', inputs: scenario.inputs, createdAt: scenario.createdAt||new Date().toISOString() };
  return { ok:true, scenario: safe };
}
function toCSV(rows){
  const esc = v => { const s=String(v==null?'':v); return /[",\n]/.test(s)? '"'+s.replace(/"/g,'""')+'"' : s; };
  return rows.map(r=>r.map(esc).join(',')).join('\r\n');
}

  },
  scenarios: [],
  activeScenarioId: null,
  theme: 'light'
};

/* Newest year present in FY_RULES, by key sort. Used when a requested year is
   missing so we never silently fall back to an older year's rates. */
function latestFYKey(){
  const keys = Object.keys(FY_RULES).sort();
  return keys[keys.length-1];
}
/* Resolves the active year. If AppState.fy is not a real year (a stale saved
   scenario, a hand-edited import), fall back to the NEWEST year and record that
   we did, so the UI can say so instead of quietly showing wrong numbers. */
function getFYRules(){
  if(FY_RULES[AppState.fy]) return FY_RULES[AppState.fy];
  return FY_RULES[latestFYKey()];
}
/* True when the year the user picked is not one we actually hold rates for. */
function isFYFallback(){ return !FY_RULES[AppState.fy]; }
function getRegimeRules(){ const fy=getFYRules(); return AppState.regime==='old'? fy.old : fy.new; }

/* Runs the full computation pipeline from AppState.inputs. This is the single
   source of truth every module/view reads from — never recompute formulas inline. */
function computeAll(){
  const fy = getFYRules();
  const inp = AppState.inputs;
  /* Pass the live inputs object itself: buildSalaryStructure reads named keys,
     and a hand-built copy here once dropped the fixed-PF overrides silently. */
  const structure = buildSalaryStructure(inp);

  const hra = calculateHRAExemption({ basicPlusDA: structure.basicPlusDA*12, hraReceived: inp.hra*12, rentPaid: inp.rentPaidMonthly*12, isMetro: inp.isMetro });
  const esi = calculateESI(structure.grossMonthly);
  const pt = calculateProfessionalTax(AppState.stateName, structure.grossMonthly, { customMonthly: inp.ptCustomMonthly });

  const npsEmployeeDeductionPct = AppState.regime==='new' ? NPS_RULES.newRegimePrivatePercent : NPS_RULES.oldRegimePrivatePercent;
  const npsCapAnnual = round2(structure.basicPlusDA*12*(AppState.profile.isGovernment? NPS_RULES.govtPercent : npsEmployeeDeductionPct));
  const employerNpsAnnual = round2(structure.erNPS*12);
  const employerNpsExempt = Math.min(employerNpsAnnual, npsCapAnnual);

  /* Taxable income for a given gross. Takes the gross as an argument so the same
     function can price regular salary alone and regular salary plus bonus. */
  function taxableForRegime(regime, grossAnnual){
    const stdDeduction = (regime==='old'? fy.old.stdDeduction: fy.new.stdDeduction);
    /* Employer NPS is a CTC cost, not employee earnings: it is NOT part of
       grossAnnual. Sec 80CCD(2) therefore has nothing to deduct here. Deducting it
       anyway understated taxable income by the whole employer contribution. */
    let deductions = stdDeduction;
    if(regime==='old'){
      deductions += Math.min(inp.ded80C,150000) + Math.min(inp.ded80D,100000) + Math.min(inp.homeLoanInterest,200000) + Math.max(0,inp.otherOldRegimeDeductions) + Math.min(hra.exemption, grossAnnual);
    }
    return Math.max(0, round2(grossAnnual - deductions));
  }

  /* Bonus is annual pay, not monthly pay. Taxing it by dividing the whole year's
     tax by 12 made every month's take-home fall when a bonus was added — the bonus
     was reducing the salary. Instead:
       - regular TDS  = tax on the salary alone, spread over 12 months
       - bonus tax    = the extra tax the bonus causes, charged in the bonus month
     This is how payroll actually withholds, and it leaves monthly take-home
     untouched by the bonus. */
  const regularAnnualGross = round2(structure.grossMonthly*12);
  const totalAnnualGross = structure.grossAnnual; // regular + bonus

  // Full-year position (what you owe for the year, bonus included).
  const taxableOld = taxableForRegime('old', totalAnnualGross);
  const taxableNew = taxableForRegime('new', totalAnnualGross);
  const resultOld = calculateOldRegimeTax(taxableOld, fy);
  const resultNew = calculateNewRegimeTax(taxableNew, fy);
  const activeResult = AppState.regime==='old'? resultOld : resultNew;
  const activeTaxable = AppState.regime==='old'? taxableOld : taxableNew;

  // Regular-salary-only position (what the monthly payslip should withhold).
  const taxableOldRegular = taxableForRegime('old', regularAnnualGross);
  const taxableNewRegular = taxableForRegime('new', regularAnnualGross);
  const resultOldRegular = calculateOldRegimeTax(taxableOldRegular, fy);
  const resultNewRegular = calculateNewRegimeTax(taxableNewRegular, fy);
  const activeRegular = AppState.regime==='old'? resultOldRegular : resultNewRegular;

  const bonus = Math.max(0, structure.components.bonus || 0);
  const taxOnBonus = Math.max(0, round2(activeResult.totalTax - activeRegular.totalTax));

  /* Place the bonus in the months the user actually receives it, then charge the
     bonus tax in those same months in proportion to each instalment. */
  const bonusSchedule = buildBonusSchedule(bonus, inp.bonusInstallments, inp.bonusMonth1, inp.bonusMonth2, inp.bonusFirstSharePct);
  const bonusTaxSchedule = allocateProRata(taxOnBonus, bonusSchedule);

  const annualTaxInfo = calculateAnnualTaxLiability(activeResult, inp.tdsAlreadyDeducted);
  // Monthly withholding is based on regular salary only.
  const monthlyTDS = round2(activeRegular.totalTax/12);

  const netMonthly = calculateTakeHomeSalary({
    grossMonthly: structure.grossMonthly,
    employeePF: structure.empPF.total,
    professionalTaxMonthly: pt.monthly,
    monthlyTDS: monthlyTDS,
    esiEmployee: esi.employee,
    otherDeductions: 0
  });
  /* The bonus month: regular net, plus the bonus, minus the tax the bonus caused. */
  const bonusMonthNet = round2(netMonthly + bonus - taxOnBonus);
  const monthlyNetSchedule = bonusSchedule.map((b,i)=>
    round2(netMonthly + b - bonusTaxSchedule[i])
  );
  const bonusPayments = bonusSchedule.map((amount,i)=>({
    month:i,
    label:MONTH_LABELS[i],
    amount,
    tax:bonusTaxSchedule[i],
    net:round2(netMonthly + amount - bonusTaxSchedule[i])
  })).filter(p=>p.amount>0);
  const netAnnual = round2(netMonthly*12 + bonus - taxOnBonus);

  const employerCost = calculateEmployerCost({ ctcAnnual: structure.ctcAnnual, extraEmployerCosts: 0 });

  const gratuity = calculateGratuity({ basicPlusDA: structure.basicPlusDA, yearsOfService: inp.yearsOfService, coveredUnderAct: inp.coveredUnderGratuityAct });
  const leaveEncashment = calculateLeaveEncashment({ avgMonthlySalary: structure.basicPlusDA+inp.hra, leaveDaysEncashed: inp.leaveDaysEncashed, yearsOfService: inp.yearsOfService, isGovernment: AppState.profile.isGovernment, atRetirement: inp.leaveAtRetirement, priorExemptionClaimed:0 });
  const freelance = calculateFreelanceIncome({ grossReceipts: inp.freelanceReceipts, actualExpenses: inp.freelanceExpenses, usePresumptive: inp.freelanceUsePresumptive });
  const hike = calculateSalaryHike(inp.offerCurrentCTC, inp.offerNewCTC);

  return {
    fy, structure, hra, esi, pt, employerNpsAnnual, employerNpsExempt,
    taxableOld, taxableNew, resultOld, resultNew, activeResult, activeTaxable,
    activeRegular, resultOldRegular, resultNewRegular, regularAnnualGross, bonus, taxOnBonus, bonusMonthNet,
    annualTaxInfo, monthlyTDS, netMonthly, netAnnual, employerCost,
    bonusSchedule, bonusTaxSchedule, monthlyNetSchedule, bonusPayments,
    gratuity, leaveEncashment, freelance, hike
  };
}

function icon(name,size){
  size = size || 16;
  return `<svg class="icon-svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]||''}</svg>`;
}
function donutSvg(segments, size){
  const r = size/2 - 8, cx = size/2, cy = size/2;
  const C = 2*Math.PI*r;
  const total = segments.reduce((a,s)=>a+Math.max(0,s.value),0);
  let offset = 0, rings = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="14"></circle>`;
  if(total > 0){
    segments.forEach((s,i)=>{
      const frac = Math.max(0,s.value)/total;
      const dash = frac*C;
      rings += `<circle class="donut-seg" data-seg="${i}" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="14" stroke-dasharray="${dash.toFixed(2)} ${(C-dash).toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})" style="color:${s.color}"></circle>`;
      offset += dash;
    });
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="Monthly salary split">${rings}</svg>`;
}

function fieldNumber({path,label,hint,min,max,step,prefix,special,nullable}){
  const val = getPath(AppState,path);
  const id = fieldId(path);
  const st = step==null?1:Number(step);
  /* Money amounts are shown raw in the input so they stay editable. This adds a
     grouped/compact read-out beside the label, so ₹1800000 reads as ₹18 L. */
  const showPretty = isValidNumber(Number(val)) && Math.abs(Number(val))>=10000;
  const pretty = showPretty ? (Math.abs(Number(val))>=100000?'₹'+fmtCompact(Number(val)):fmt(Number(val),false)) : '';
  return `<div class="field">
    <label for="${id}"${pretty?' class="has-pretty"':''}><span class="lbl-text">${label}</span>${pretty?`<span class="field-pretty" aria-hidden="true">${pretty}</span>`:''}</label>
    <div class="stepper" data-stepper>
      <button type="button" class="step-btn" data-dir="-1" data-step="${st}" data-min="${min!=null?min:''}" data-max="${max!=null?max:''}" aria-label="Decrease ${escapeHtml(label)}">${icon('minus',13)}</button>
      <input id="${id}" type="number" inputmode="decimal" data-bind="${path}" data-evt="change" data-step="${st}" ${special?`data-special="${special}"`:''} ${nullable?'data-nullable="1"':''} value="${isValidNumber(val)?val:''}" ${min!=null?`min="${min}"`:''} ${max!=null?`max="${max}"`:''} step="${st}">
      <button type="button" class="step-btn" data-dir="1" data-step="${st}" data-min="${min!=null?min:''}" data-max="${max!=null?max:''}" aria-label="Increase ${escapeHtml(label)}">${icon('plus',13)}</button>
    </div>
    ${hint?`<div class="hint">${hint}</div>`:''}
  </div>`;
}
function fieldRange({path,label,min,max,step,display}){
  const val = getPath(AppState,path);
  const pct = max>min ? ((Number(val)||0)-min)/(max-min)*100 : 50;
  return `<div class="field range-field" data-tone="violet">
    <div class="range-head"><label for="${fieldId(path)}">${label}</label><span class="range-val" data-range-value>${display?display(val):val}</span></div>
    <div class="range-wrap"><input id="${fieldId(path)}" type="range" data-bind="${path}" data-evt="change" min="${min}" max="${max}" step="${step}" value="${val}" style="--pct:${Math.max(0,Math.min(100,pct)).toFixed(2)}%"></div>
    <div class="range-scale"><span>${display?display(min):min}</span><span>${display?display(max):max}</span></div>
  </div>`;
}
function fieldSelect({path,label,options,hint}){
  const val = getPath(AppState,path);
  const id = fieldId(path);
  const numeric = options.length>0 && options.every(o=>o.value!=='' && isValidNumber(Number(o.value)));
  return `<div class="field">
    <label for="${id}">${label}</label>
    <select id="${id}" data-bind="${path}" data-evt="change" ${numeric?'data-type="number"':''}>
      ${options.map(o=>`<option value="${o.value}" ${String(o.value)===String(val)?'selected':''}>${o.label}</option>`).join('')}
    </select>
    ${hint?`<div class="hint">${hint}</div>`:''}
  </div>`;
}
function fieldCheckbox({path,label}){
  const val = !!getPath(AppState,path);
  return `<label class="check"><input type="checkbox" data-bind="${path}" data-evt="change" data-type="bool" ${val?'checked':''}> ${label}</label>`;
}
function traceDetails(title,lines){
  return `<details class="trace"><summary>${title}</summary><div class="trace-body">
    ${lines.map(l=>`<div class="trace-line"><span>${l[0]}</span><span>${l[1]}</span></div>`).join('')}
  </div></details>`;
}
function slabTableHtml(result){
  const rows = result.slabRows.map(r=>`<tr><td>${fmt(r.min,false)} – ${r.max===Infinity?'above':fmt(r.max,false)}</td><td class="num">${(r.rate*100).toFixed(0)}%</td><td class="num">${fmt(r.taxable,false)}</td><td class="num">${fmt(r.tax,false)}</td></tr>`).join('');
  return `<div class="table-wrap"><table><thead><tr><th>Slab</th><th class="num">Rate</th><th class="num">Taxable in slab</th><th class="num">Tax</th></tr></thead><tbody>
    ${rows}
    <tr class="total"><td colspan="3">Tax before rebate</td><td class="num">${fmt(result.baseTax,false)}</td></tr>
    ${result.rebate>0?`<tr class="good"><td colspan="3">Sec 87A rebate${result.marginalReliefRebate>0?' (incl. marginal relief)':''}</td><td class="num">-${fmt(result.rebate,false)}</td></tr>`:''}
    <tr><td colspan="3">Tax after rebate</td><td class="num">${fmt(result.taxAfterRebate,false)}</td></tr>
    ${result.surcharge>0?`<tr><td colspan="3">Surcharge @ ${(result.surchargeRate*100).toFixed(0)}%${result.marginalReliefSurcharge>0?' (after marginal relief)':''}</td><td class="num">${fmt(result.surcharge,false)}</td></tr>`:''}
    <tr><td colspan="3">Health &amp; Education Cess @ ${(result.fy? result.fy.new.cess*100 : 4)}%</td><td class="num">${fmt(result.cess,false)}</td></tr>
    <tr class="total"><td colspan="3">Total annual tax</td><td class="num">${fmt(result.totalTax,false)}</td></tr>
  </tbody></table></div>`;
}

/* ---------- navigation ---------- */
const MOBILE_DOCK = ['dashboard','structure','incometax','timeline'];
function renderNav(){
  const nav=document.getElementById('nav');
  const main = MODULES.filter(m=>!m.more);
  const extra = MODULES.filter(m=>m.more);
  let lastGroup=null, html='';
  main.forEach(m=>{
    if(m.group!==lastGroup){ html += `<div class="nav-group">${escapeHtml(m.group)}</div>`; lastGroup=m.group; }
    html += `<button type="button" data-module="${m.key}" data-tone="${moduleTone(m.key)}" class="${AppState.module===m.key?'active':''}" aria-current="${AppState.module===m.key?'page':'false'}">${icon(m.icon,17)}<span class="nav-label">${escapeHtml(m.label)}</span><span class="nav-dot" aria-hidden="true"></span></button>`;
  });
  if(extra.length){
    html += `<details class="nav-more" data-tone="slate" ${extra.some(m=>AppState.module===m.key)?'open':''}><summary>${icon('layers',16)}<span>More tools</span></summary>`;
    html += extra.map(m=>`<button type="button" data-module="${m.key}" data-tone="${moduleTone(m.key)}" class="${AppState.module===m.key?'active':''}" aria-current="${AppState.module===m.key?'page':'false'}">${icon(m.icon,17)}<span class="nav-label">${escapeHtml(m.label)}</span><span class="nav-dot" aria-hidden="true"></span></button>`).join('');
    html += '</details>';
  }
  nav.innerHTML = html;
  nav.querySelectorAll('button[data-module]').forEach(b=> b.addEventListener('click',()=>{ setModule(b.dataset.module); closeSidebar(); }));

  const dock=document.getElementById('dockTabs');
  const dockItems = MOBILE_DOCK.map(k=>MODULES.find(m=>m.key===k)).filter(Boolean);
  dock.innerHTML = dockItems.map(m=>`<button type="button" data-module="${m.key}" data-tone="${moduleTone(m.key)}" class="${AppState.module===m.key?'active':''}">${icon(m.icon,18)}<span>${escapeHtml(m.label.split(' ')[0])}</span></button>`).join('')
    + `<button type="button" data-action="all-modules" data-tone="slate" class="${dockItems.some(m=>m.key===AppState.module)?'':'active'}">${icon('layers',18)}<span>More</span></button>`;
  dock.querySelectorAll('button[data-module]').forEach(b=> b.addEventListener('click',()=> setModule(b.dataset.module)));
}
function setModule(key){
  AppState.module=key;
  render();
  if(document.getElementById('main')) document.getElementById('main').scrollTop=0;
  window.scrollTo({top:0,behavior:'instant'});
}
function openSidebar(){
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('backdrop').classList.add('show');
  document.getElementById('menuBtn').setAttribute('aria-expanded','true');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  if(!document.getElementById('sheet')?.classList.contains('open')) document.getElementById('backdrop').classList.remove('show');
  document.getElementById('menuBtn').setAttribute('aria-expanded','false');
}

/* ---------- summary rail / dock ---------- */
function renderSummary(c){
  const netPct = c.structure.ctcAnnual>0 ? Math.max(0, Math.min(100, c.netAnnual/c.structure.ctcAnnual*100)) : 0;
  const eff = c.structure.grossAnnual>0 ? (c.activeResult.totalTax/c.structure.grossAnnual*100) : 0;
  const winner = c.resultNew.totalTax<=c.resultOld.totalTax ? 'New' : 'Old';
  const savings = Math.abs(c.resultNew.totalTax-c.resultOld.totalTax);
  const html = `
    <div class="rail-hero" data-tone="violet">
      <div class="rail-hero-head"><span>Monthly in-hand</span><span class="live-pill"><i></i>Live</span></div>
      <div class="rail-hero-value">${fmt(c.netMonthly,false)}</div>
      <div class="rail-hero-sub">${fmtCompact(c.netAnnual)} a year${c.bonus>0?' including bonus':''} after tax, PF and professional tax</div>
      <div class="rail-meter"><span style="width:${netPct.toFixed(1)}%"></span></div>
      <div class="rail-hero-foot"><span>Net / CTC</span><b>${netPct.toFixed(0)}%</b></div>
    </div>
    <div class="rail-stats">
      <div class="rail-stat"><span>Annual tax</span><b>${fmtCompact(c.activeResult.totalTax)}</b><small>${eff.toFixed(1)}% of gross</small></div>
      <div class="rail-stat"><span>Annual CTC</span><b>${fmtCompact(c.structure.ctcAnnual)}</b><small>${AppState.regime==='old'?'Old':'New'} regime</small></div>
    </div>
    <div class="rail-winner" data-tone="${winner==='New'?'emerald':'amber'}">${icon('zap',15)}<div><b>${winner} regime is ahead</b>Saves ${fmtCompact(savings)} a year at today's inputs.</div></div>
    <div class="rail-actions" data-tone="violet">
      <button type="button" class="rail-action" data-action="structure">${icon('structure',13)} Edit salary</button>
      <button type="button" class="rail-action" data-action="comparison">${icon('comparison',13)} Compare</button>
      <button type="button" class="rail-action" data-action="scenarios">${icon('copy',13)} Scenarios</button>
      <button type="button" class="rail-action" data-action="print">${icon('print',13)} Print</button>
    </div>
    ${c.structure.enteredCTC!=null && Math.abs(c.structure.reconciliationDiff)>1 ? `<div class="banner warn" style="margin:0"><b>CTC mismatch</b><p>Entered and modeled CTC differ by ${fmt(c.structure.reconciliationDiff,false)}. Open Salary Structure to reconcile.</p></div>`:''}
    <p class="rail-note">Every figure updates live from your inputs. Nothing is uploaded.</p>
  `;
  document.getElementById('summaryRail').innerHTML = html;
  document.getElementById('dockValue').textContent = fmt(c.netMonthly,false);
  const dockSub=document.getElementById('dockSub');
  if(dockSub) dockSub.textContent = fmtCompact(c.netAnnual)+' / yr';
  document.getElementById('sheetBody').innerHTML = html;
}

function mComparison(c){
  const better = c.resultNew.totalTax<=c.resultOld.totalTax?'new':'old';
  const saving = Math.abs(c.resultNew.totalTax-c.resultOld.totalTax);
  const maxTax=Math.max(c.resultNew.totalTax,c.resultOld.totalTax,1);
  const monthlyOld = round2(c.structure.grossMonthly-c.structure.empPF.total-c.pt.monthly-c.resultOld.totalTax/12);
  const monthlyNew = round2(c.structure.grossMonthly-c.structure.empPF.total-c.pt.monthly-c.resultNew.totalTax/12);
  const regimeCard=(label,result,taxable,tone,isBest,monthly)=>{
    return card(label,escapeHtml(c.fy.ay)+(isBest?' · lower tax':' · higher tax'),`
      ${recapRows([
        {label:'Taxable income',value:fmt(taxable,false)},
        {label:'Tax before rebate',value:fmt(result.baseTax,false)},
        {label:'Rebate',value:fmt(result.rebate,false)},
        {label:'Surcharge',value:fmt(result.surcharge,false)},
        {label:'Cess',value:fmt(result.cess,false)},
        {label:'Total tax',value:fmt(result.totalTax,false),cls:'total'},
        {label:'Effective rate',value:(c.structure.grossAnnual?(result.totalTax/c.structure.grossAnnual*100).toFixed(2):'0')+'%'},
        {label:'Average monthly in-hand',value:fmt(monthly,false)}
      ])}
      <div class="rt-row" data-tone="${tone}" style="margin-top:12px"><div class="rt-top"><span>Share of the larger tax bill</span><span class="mono">${(result.totalTax/maxTax*100).toFixed(0)}%</span></div><div class="rt-track"><span style="width:${(result.totalTax/maxTax*100).toFixed(1)}%"></span></div></div>
    `,null,{tone,icon:isBest?'check':'comparison'});
  };
  return pageHead('Old vs New Regime','Both regimes are computed independently from the same salary, deductions and '+AppState.fy+' rules. No figure is copied between columns.')+`
    <div class="verdict" data-tone="${better==='new'?'emerald':'amber'}">
      <span class="v-ico">${icon(better==='new'?'zap':'shield',20)}</span>
      <div><b>${better==='new'?'New regime':'Old regime'} is ahead by ${fmt(saving,false)} a year</b><span>That is ${fmt(round2(saving/12),false)} a month at today's inputs. Confirm against your actual investment and rent proofs before choosing.</span></div>
    </div>
    <div class="grid grid-2">
      ${regimeCard('New regime',c.resultNew,c.taxableNew,'emerald',better==='new',monthlyNew)}
      ${regimeCard('Old regime',c.resultOld,c.taxableOld,'amber',better==='old',monthlyOld)}
    </div>
    <div class="grid grid-2">
      ${card('Old-regime deductions','Applied only to the Old regime column above.',`
        <div class="grid grid-2 field-grid">
          ${fieldNumber({path:'inputs.ded80C',label:'80C investments (PPF, ELSS, EPF, life insurance)',min:0,max:150000,step:5000})}

        </div>
        <div class="card-note">Statutory caps are applied: 80C ≤ ₹1.5L, 80D ≤ ₹1L, home-loan interest ≤ ₹2L per year.</div>
      `,null,{tone:'amber',icon:'wallet'})}
      ${card('HRA exemption','Least of the three, old regime only.',`

function mTimeline(c){
  const s=c.structure;
  const months=MONTH_LABELS;
  const netByMonth = Array.isArray(c.monthlyNetSchedule)?c.monthlyNetSchedule:months.map(()=>c.netMonthly);
  const bonusByMonth = Array.isArray(c.bonusSchedule)?c.bonusSchedule:[];
  const bonusTaxByMonth = Array.isArray(c.bonusTaxSchedule)?c.bonusTaxSchedule:[];
  const maxNet=Math.max.apply(null,netByMonth.concat([1]));
  const minNet=Math.min.apply(null,netByMonth);
  let rows='', totalNet=0;
  months.forEach((m,i)=>{
    const bonus=bonusByMonth[i]||0;
    const bonusTax=bonusTaxByMonth[i]||0;
    const tds=round2(c.monthlyTDS+bonusTax);
    const net=netByMonth[i];
    totalNet+=net;
    rows+=`<tr><td>${m}</td><td class="num">${fmt(s.grossMonthly+bonus,false)}</td><td class="num">${bonus?fmt(bonus,false):'—'}</td><td class="num">${fmt(tds,false)}</td><td class="num">${fmt(net,false)}</td></tr>`;
  });
  const chart = months.map((m,i)=>{
    const net=netByMonth[i];
    const hpx=maxNet>0?Math.max(4,net/maxNet*100):4;
    const isBonus=(bonusByMonth[i]||0)>0;
    const monthBonusTax=bonusTaxByMonth[i]||0;
    return `<div class="tb" title="${m}: ${fmt(net,false)}${isBonus?' (bonus month; '+fmt(monthBonusTax,false)+' bonus tax)':''}"><span class="tb-val">${fmtCompact(net)}</span><div class="tb-bar ${isBonus?'bonus':''}" style="height:${hpx}%"></div><span class="tb-lbl">${m}</span></div>`;
  }).join('');
  const bonusMonths=months.map((m,i)=>bonusByMonth[i]>0?m:null).filter(Boolean);
  return pageHead('12-Month Timeline','A projection, not payroll history. Bonus lands in the month you set and its tax is withheld in that same month.')+`
    <div class="grid grid-3">
      ${kpi('Total net for the year',fmt(totalNet,false),'all 12 months','emerald','takehome')}
      ${kpi('Lowest month',fmt(minNet,false),'regular-month net','blue','chart')}
      ${kpi('Bonus months',bonusMonths.length?bonusMonths.join(', '):'None','variable pay timing','orange','bonus')}
    </div>
    ${card('Net pay by month','Bar height is relative to the best month. Orange bars include bonus.',`<div class="timeline-chart" role="img" aria-label="Net pay by month">${chart}</div>`,null,{tone:'indigo',icon:'chart'})}
    ${card('Month-by-month table','Gross, bonus, TDS and net for each month. TDS includes tax withheld on a bonus paid that month.',`<div class="table-wrap"><table class="table-compact"><thead><tr><th>Month</th><th class="num">Gross</th><th class="num">Bonus</th><th class="num">TDS</th><th class="num">Net</th></tr></thead><tbody>${rows}<tr class="total"><td colspan="4">Total net for the year</td><td class="num">${fmt(totalNet,false)}</td></tr></tbody></table></div>`,null,{tone:'violet',icon:'timeline'})}`;
}

/* ================= FIRST-RUN INTAKE =================
   The app never opens on someone else's salary. Until a CTC is entered, this is
   the only screen: one number in, a live preview out, then the full app. */
function intakeSnapshot(){
  const inp=AppState.inputs;
  const ctc=Number(inp.enteredAnnualCTC)||0;
  const ready=ctc>=100000;
  const canContinue=ready&&!!AppState.stateName;
  let d=null,c=null;
  if(ready){
    d=deriveStructureFromCTC(ctc,{
      basicPercent:inp.intakeBasicPercent==null?40:inp.intakeBasicPercent,
      isMetro:inp.isMetro,
      bonus:inp.bonus,
      pfIgnoreCeiling:inp.pfIgnoreCeiling,
      employerNpsPercent:inp.employerNpsPercent
    });
    const saved=Object.assign({},inp);
    Object.assign(inp,{basic:d.basic,hra:d.hra,specialAllowance:d.specialAllowance,bonus:d.bonus});
    try{ c=computeAll(); }catch(e){ c=null; }
    Object.assign(inp,saved);
  }
  return {ctc,ready,canContinue,d,c};
}

function updateRangeFill(el){
  if(!el) return;
  const min=Number(el.min)||0, max=Number(el.max)||100, v=Number(el.value)||0;
  const pct=max>min?((v-min)/(max-min)*100):0;
  el.style.setProperty('--pct',Math.max(0,Math.min(100,pct)).toFixed(2)+'%');
}

function refreshIntakePreview(){
  const snap=intakeSnapshot();
  const preview=document.getElementById('intakePreview');
  if(preview) preview.innerHTML=intakePreviewHtml(snap);
  const help=document.getElementById('ctcHelp');
  if(help) help.textContent=snap.ctc?fmtCompact(snap.ctc)+' / yr':'per year';
  const val=document.getElementById('ctcRangeVal');
  if(val) val.textContent=snap.ctc?fmtCompact(snap.ctc):'₹6 L';
  const go=document.getElementById('ctcGo');
  if(go) go.disabled=!snap.canContinue;
  const err=document.getElementById('ctcErr');
  if(err) err.hidden=!(snap.ctc>0 && snap.ctc<100000);
  const stateErr=document.getElementById('stateErr');
  if(stateErr) stateErr.hidden=!(snap.ready && !AppState.stateName);
  document.querySelectorAll('.preset').forEach(b=>{
    b.classList.toggle('active', Math.abs(Number(b.dataset.ctc)-snap.ctc)<1);
  });
}

function bindIntakeEvents(){
  const entry=document.getElementById('ctcEntry');
  const go=document.getElementById('ctcGo');
  const skip=document.getElementById('ctcSkip');
  const pct=document.getElementById('basicPct');
  const ctcRange=document.getElementById('ctcRange');
  const stateSel=document.getElementById('intakeState');

  if(stateSel){
    stateSel.addEventListener('change',()=>{
      AppState.stateName=stateSel.value;
      refreshIntakePreview();
    });
  }
  if(pct){
    updateRangeFill(pct);
    pct.addEventListener('input',()=>{
      AppState.inputs.intakeBasicPercent=clampNum(Number(pct.value),20,60);
      updateRangeFill(pct);
      const lbl=document.getElementById('basicPctVal');
      if(lbl) lbl.textContent=AppState.inputs.intakeBasicPercent+'%';
      refreshIntakePreview();
    });
  }
  if(ctcRange){
    updateRangeFill(ctcRange);
    ctcRange.addEventListener('input',()=>{
      const v=Number(ctcRange.value);
      AppState.inputs.enteredAnnualCTC=v;
      if(entry) entry.value=inrGroup(v);
      updateRangeFill(ctcRange);
      refreshIntakePreview();
    });
  }
  document.querySelectorAll('.preset').forEach(b=>{
    b.addEventListener('click',()=>{
      const v=Number(b.dataset.ctc);
      AppState.inputs.enteredAnnualCTC=v;
      if(entry) entry.value=inrGroup(v);
      if(ctcRange){
        ctcRange.value=Math.min(Number(ctcRange.max),Math.max(Number(ctcRange.min),v));
        updateRangeFill(ctcRange);
      }
      refreshIntakePreview();
    });
  });
  document.querySelectorAll('[data-metro]').forEach(b=>{
    b.addEventListener('click',()=>{
      AppState.inputs.isMetro=b.dataset.metro==='1';
      document.querySelectorAll('[data-metro]').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));
      refreshIntakePreview();
    });
  });

  if(entry){
    if(!AppState.inputs.enteredAnnualCTC && entry.value) entry.value='';
    entry.addEventListener('input',()=>{
      const digits=entry.value.replace(/[^\d]/g,'').slice(0,9);
      const v=digits?Number(digits):NaN;
      const grouped=digits?inrGroup(v):'';
      if(entry.value!==grouped) entry.value=grouped;
      AppState.inputs.enteredAnnualCTC=isValidNumber(v)&&v>0?v:null;
      refreshIntakePreview();
      const len=entry.value.length;
      try{ entry.setSelectionRange(len,len); }catch(e){}
    });
    entry.addEventListener('keydown',e=>{
      if(e.key==='Enter'){ e.preventDefault(); const btn=document.getElementById('ctcGo'); if(btn&&!btn.disabled) btn.click(); }
    });
  }
  if(go) go.addEventListener('click',()=>{
    const v=Number(AppState.inputs.enteredAnnualCTC);
    if(!isValidNumber(v)||v<100000){ toast('Enter an annual CTC of at least ₹1,00,000'); return; }
    if(!AppState.stateName){
      const stateErr=document.getElementById('stateErr'); if(stateErr) stateErr.hidden=false;
      toast('Choose your state / UT for professional tax');
      return;
    }
    applyCTCToStructure(v);
    AppState.onboarded=true;
    AppState.module='dashboard';
    render();
    toast('Salary structure built from '+fmtCompact(v)+'. Adjust anything in Salary Structure.');
  });
  if(skip) skip.addEventListener('click',()=>{
    if(!AppState.stateName){
      const stateErr=document.getElementById('stateErr'); if(stateErr) stateErr.hidden=false;
      toast('Choose your state / UT for professional tax');
      return;
    }
    AppState.onboarded=true;
    AppState.module='structure';
    render();
    toast('Enter your components in Salary Structure.');
  });
  refreshIntakePreview();
}

/* Writes a derived structure into the live inputs. Single place this happens. */
function applyCTCToStructure(annualCTC){
  const d = deriveStructureFromCTC(annualCTC, {
    basicPercent: AppState.inputs.intakeBasicPercent==null?40:AppState.inputs.intakeBasicPercent,
    isMetro: AppState.inputs.isMetro,
    bonus: AppState.inputs.bonus,
    pfIgnoreCeiling: AppState.inputs.pfIgnoreCeiling,
    employerNpsPercent: AppState.inputs.employerNpsPercent
  });
  const inp = AppState.inputs;
  inp.enteredAnnualCTC = annualCTC;
  inp.basic = d.basic;
  inp.hra = d.hra;
  inp.specialAllowance = d.specialAllowance;
  inp.bonus = d.bonus;
  return d;
}

  const gate=!AppState.onboarded;
  document.body.classList.toggle('onboarding',gate);
  document.body.dataset.module=gate?'intake':AppState.module;
  document.body.dataset.tone=gate?'violet':moduleTone(AppState.module);

  const fySel=document.getElementById('fySelect');
  if(fySel) fySel.value=AppState.fy;
  document.getElementById('regimeOld').classList.toggle('active',AppState.regime==='old');
  document.getElementById('regimeNew').classList.toggle('active',AppState.regime==='new');

  if(gate){
    document.getElementById('fyBanner').innerHTML='';
    document.getElementById('view').innerHTML=renderIntake();
    document.getElementById('summaryRail').innerHTML='';
    document.getElementById('dockTabs').innerHTML='';
    document.getElementById('nav').innerHTML='';
    const dv=document.getElementById('dockValue'); if(dv) dv.textContent='₹—';
    const ds=document.getElementById('dockSub'); if(ds) ds.textContent='';
    bindIntakeEvents();
    return;
  }
  let c;
  try{ c=computeAll(); }
  catch(e){
    document.getElementById('view').innerHTML=`<div class="banner bad"><b>Calculation error</b><p>${escapeHtml(e.message)}</p></div>`;
    console.error(e);
    return;
  }
  renderFYBanner();
  renderNav();
  const fn=MODULE_RENDERERS[AppState.module]||mDashboard;
  document.getElementById('view').innerHTML=fn(c);
  renderSummary(c);
  bindViewEvents();
  bindModuleButtons(c);
  if(lastBind){
    const target=document.querySelector(`[data-bind="${lastBind}"]`);
    lastBind=null;
    if(target && document.activeElement!==target){
      target.focus({preventScroll:true});
      try{
        if(typeof target.setSelectionRange==='function' && target.type!=='range'){
          const len=target.value.length;
          target.setSelectionRange(len,len);
        }
      }catch(e){}
    }
  }
}

let lastBind=null;
function bindViewEvents(){
  document.querySelectorAll('[data-bind]').forEach(el=>{
    if(el.type==='range'){
      updateRangeFill(el);
      el.addEventListener('input',()=>{
        updateRangeFill(el);
        const n=Number(el.value);
        if(isValidNumber(n)) setPath(AppState,el.dataset.bind,n);
        const field=el.closest('.range-field');
        const label=field?field.querySelector('[data-range-value]'):null;
        if(label) label.textContent=el.value;
      });
      el.addEventListener('change',()=>{
        const n=Number(el.value);
        if(!isValidNumber(n)) return;
        setPath(AppState,el.dataset.bind,n);
        lastBind=el.dataset.bind;
        render();
      });
      return;
    }
    const evt=el.dataset.evt||'change';
    el.addEventListener(evt,()=>{
      const numeric = el.type==='number' || el.dataset.type==='number';
      let val;
      if(el.type==='checkbox') val=el.checked;
      else if(numeric) val=el.value===''? (el.dataset.nullable!=null? null : 0) : Number(el.value);
      else val=el.value;
      if(numeric){
        if(!isValidNumber(val)){ el.classList.add('invalid'); return; }
        /* min/max only exist on number inputs. A numeric select (month,
           instalments) has no min/max, and reading .min there yields undefined,
           which used to turn the value into NaN. */
        const min=el.type==='number'&&el.min!==''?Number(el.min):null;
        const max=el.type==='number'&&el.max!==''?Number(el.max):null;
        if(min!=null) val=Math.max(min,val);
        if(max!=null) val=Math.min(max,val);
        el.value=val;
      }
      el.classList.remove('invalid');
      setPath(AppState,el.dataset.bind,val);
      lastBind=el.dataset.bind;
      render();
    });
  });

  document.querySelectorAll('[data-stepper]').forEach(wrap=>{
    const input=wrap.querySelector('input[data-bind]');
    if(!input) return;
    wrap.querySelectorAll('.step-btn').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const step=Number(btn.dataset.step)||1;
        let v=Number(input.value)||0;
        v=round2(v+step*Number(btn.dataset.dir||1));
        if(btn.dataset.min!=='') v=Math.max(Number(btn.dataset.min),v);
        if(btn.dataset.max!=='') v=Math.min(Number(btn.dataset.max),v);
        input.value=v;
        setPath(AppState,input.dataset.bind,v);
        lastBind=input.dataset.bind;
        render();
      });
    });
  });

  bindDonutHover();
}

function bindDonutHover(){
  document.querySelectorAll('.donut-wrap').forEach(wrap=>{
    const center=wrap.querySelector('.donut-center');
    if(!center) return;
    const segs=Array.from(wrap.querySelectorAll('.donut-seg'));
    const card=wrap.closest('.card');
    const items=card?Array.from(card.querySelectorAll('.chart-legend li')):[];
    const restore=()=>{
      center.innerHTML=`<div class="dc-lbl">${escapeHtml(center.dataset.baseLabel||'')}</div><div class="dc-val">${escapeHtml(center.dataset.baseValue||'')}</div><div class="dc-sub">${escapeHtml(center.dataset.baseSub||'')}</div>`;
      segs.forEach(s=>s.classList.remove('dim','active'));
      items.forEach(li=>li.classList.remove('active'));
    };
    const activate=(idx)=>{
      if(idx==null) return restore();
      segs.forEach((s,i)=>s.classList.toggle('dim',i!==idx));
      items.forEach((li,i)=>li.classList.toggle('active',i===idx));
      const li=items[idx];
      if(li){
        center.innerHTML=`<div class="dc-lbl">${escapeHtml(li.dataset.label||'')}</div><div class="dc-val">${escapeHtml(li.dataset.amount||'')}</div><div class="dc-sub">${escapeHtml(li.dataset.pct||'')} of gross</div>`;
      }
    };
    items.forEach((li,i)=>{
      li.addEventListener('mouseenter',()=>activate(i));
      li.addEventListener('mouseleave',restore);
      li.addEventListener('focus',()=>activate(i));
      li.addEventListener('blur',restore);
      li.tabIndex=0;
    });
    segs.forEach((s,i)=>{
      s.addEventListener('mouseenter',()=>activate(i));
      s.addEventListener('mouseleave',restore);
    });
  });
}

/* ---------- sheet ---------- */
let sheetOpenFrame=0;
function openSheet(renderFn){
  renderFn();
  const sheet=document.getElementById('sheet');
  if(sheetOpenFrame) cancelAnimationFrame(sheetOpenFrame);
  sheet.hidden=false;
  sheet.style.transform='';
  document.getElementById('sheetBackdrop').classList.add('show');
  document.body.classList.add('no-scroll');
  sheetOpenFrame=requestAnimationFrame(()=>{ sheetOpenFrame=0; sheet.classList.add('open'); });
  setTimeout(()=>{ const btn=document.getElementById('sheetClose'); if(btn) btn.focus({preventScroll:true}); },160);
}
function closeSheet(){
  const sheet=document.getElementById('sheet');
  if(!sheet||sheet.hidden) return;
  if(sheetOpenFrame){ cancelAnimationFrame(sheetOpenFrame); sheetOpenFrame=0; }
  sheet.classList.remove('open');
  sheet.style.transform='';
  document.getElementById('sheetBackdrop').classList.remove('show');
  document.body.classList.remove('no-scroll');
  setTimeout(()=>{ if(!sheet.classList.contains('open')) sheet.hidden=true; },240);
}
function initSheetDrag(){
  const sheet=document.getElementById('sheet');
  const handle=document.getElementById('sheetHandle');
  const bar=sheet.querySelector('.sheet-bar');
  let startY=0,dy=0,dragging=false;
  const start=e=>{
    if(e.target.closest('button')) return;
    dragging=true; startY=e.clientY; dy=0;
    sheet.style.transition='none';
  };
  const move=e=>{
    if(!dragging) return;
    dy=Math.max(0,e.clientY-startY);
    sheet.style.transform=`translateY(${dy}px)`;
  };
  const end=()=>{
    if(!dragging) return;
    dragging=false;
    sheet.style.transition='';
    if(dy>110){
      sheet.style.transform='';
      requestAnimationFrame(closeSheet);
    } else {
      sheet.style.transform='';
    }
  };
  [handle,bar].forEach(el=>{
    if(!el) return;
    el.addEventListener('pointerdown',start);
  });
  window.addEventListener('pointermove',move,{passive:true});
  window.addEventListener('pointerup',end);
  window.addEventListener('pointercancel',end);
}

/* ---------- command palette ---------- */
const PALETTE_EXTRAS=[
  {label:'Toggle light / dark theme',group:'Action',icon:'palette',action:'theme'},
  {label:'Save or load a scenario',group:'Action',icon:'copy',action:'scenarios'},
  {label:'Print a full report',group:'Action',icon:'print',action:'print'},
  {label:'Export summary as CSV',group:'Action',icon:'download',action:'export'},
  {label:'Run calculation tests',group:'Action',icon:'check',action:'tests'}
];
let paletteItems=[],paletteIndex=0;
function paletteData(){
  return MODULES.map(m=>({label:m.label,group:m.group,icon:m.icon,module:m.key,tone:moduleTone(m.key)})).concat(PALETTE_EXTRAS);
}
function paletteFilter(q){
  const s=(q||'').trim().toLowerCase();
  return paletteData().filter(it=>!s||it.label.toLowerCase().includes(s)||it.group.toLowerCase().includes(s));
}
function openPalette(){
  const ov=document.getElementById('cmdOverlay');
  ov.hidden=false;
  const input=document.getElementById('cmdInput');
  input.value='';
  renderPalette('');
  setTimeout(()=>input.focus(),20);
}
function closePalette(){
  document.getElementById('cmdOverlay').hidden=true;
}
function togglePalette(){ document.getElementById('cmdOverlay').hidden?openPalette():closePalette(); }
function renderPalette(q){
  const items=paletteFilter(q).slice(0,14);
  paletteItems=items;
  paletteIndex=0;
  const list=document.getElementById('cmdList');
  list.innerHTML=items.length?items.map((it,i)=>`<button type="button" class="cmd-item ${i===0?'active':''}" data-palette-index="${i}" data-tone="${it.tone||'violet'}">${icon(it.icon,17)}<span class="cmd-item-label">${escapeHtml(it.label)}</span><span class="cmd-item-group">${escapeHtml(it.group)}</span></button>`).join(''):`<div class="cmd-empty">No module or action matches “${escapeHtml(q)}”.</div>`;
  list.querySelectorAll('[data-palette-index]').forEach(btn=>{
    btn.addEventListener('click',()=>runPaletteItem(paletteItems[Number(btn.dataset.paletteIndex)]));
  });
}
function paletteMove(delta){
  if(!paletteItems.length) return;
  paletteIndex=(paletteIndex+delta+paletteItems.length)%paletteItems.length;
  document.querySelectorAll('.cmd-item').forEach((el,i)=>el.classList.toggle('active',i===paletteIndex));
  const active=document.querySelector('.cmd-item.active');
  if(active) active.scrollIntoView({block:'nearest'});
}
function runPaletteItem(item){
  if(!item) return;
  closePalette();
  if(item.module) setModule(item.module);
  else runAction(item.action);
}
function initPalette(){
  const input=document.getElementById('cmdInput');
  document.getElementById('cmdBtn').addEventListener('click',openPalette);
  input.addEventListener('input',()=>renderPalette(input.value));
  input.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){ e.preventDefault(); paletteMove(1); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); paletteMove(-1); }
    else if(e.key==='Enter'){ e.preventDefault(); runPaletteItem(paletteItems[paletteIndex]); }
    else if(e.key==='Escape'){ e.preventDefault(); closePalette(); }
  });
  document.getElementById('cmdOverlay').addEventListener('click',e=>{ if(e.target.id==='cmdOverlay') closePalette(); });
}

/* ---------- actions ---------- */
function runAction(action){
  if(!action) return;
  if(MODULES.some(m=>m.key===action)){ setModule(action); return; }
  if(action==='theme'){ toggleTheme(); return; }
  if(action==='scenarios'){ openSheet(renderScenarioSheet); return; }
  if(action==='print'){ renderPrintReport(computeAll()); window.print(); return; }
  if(action==='export'){ exportCSV(); return; }
  if(action==='tests'){ openSheet(renderTestSheet); return; }
  if(action==='all-modules'){ openSidebar(); return; }
}

/* ---------- theme ---------- */
function applyTheme(t,persist){
  const theme=t==='dark'?'dark':'light';
  document.documentElement.setAttribute('data-theme',theme);
  AppState.theme=theme;
  const btn=document.getElementById('themeBtn');
  if(btn){
    btn.innerHTML=icon(theme==='dark'?'sun':'moon',18);
    btn.setAttribute('aria-label',theme==='dark'?'Switch to light theme':'Switch to dark theme');
    btn.title=theme==='dark'?'Switch to light theme':'Switch to dark theme';
  }
  const meta=document.getElementById('themeColorMeta');
  if(meta) meta.setAttribute('content',theme==='dark'?'#080712':'#f6f7ff');
  if(persist){ try{ localStorage.setItem('salary-studio-theme',theme); }catch(e){} }
}
function toggleTheme(){
  applyTheme(AppState.theme==='dark'?'light':'dark',true);
}

/* ---------- init ---------- */
function init(){
  let theme='light';
  try{ theme=localStorage.getItem('salary-studio-theme')||''; }catch(e){}
  if(!theme) theme=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
  applyTheme(theme,false);

  const fySel=document.getElementById('fySelect');
  fySel.innerHTML=Object.keys(FY_RULES).map(k=>`<option value="${k}">${k}</option>`).join('');
  fySel.value=AppState.fy;

  document.getElementById('regimeOld').addEventListener('click',()=>{ AppState.regime='old'; render(); });
  document.getElementById('regimeNew').addEventListener('click',()=>{ AppState.regime='new'; render(); });
  document.getElementById('menuBtn').addEventListener('click',()=>{
    if(document.getElementById('sidebar').classList.contains('open')) closeSidebar();
    else openSidebar();
  });
  document.getElementById('closeSidebar').addEventListener('click',closeSidebar);
  document.getElementById('backdrop').addEventListener('click',closeSidebar);
  document.getElementById('sheetBackdrop').addEventListener('click',closeSheet);
  document.getElementById('dockSummary').addEventListener('click',()=>openSheet(()=>{
    const c=computeAll(); renderSummary(c);
    document.getElementById('sheetTitle').textContent='Live summary';
  }));
  document.getElementById('dockSummary').addEventListener('keydown',e=>{
    if(e.key==='Enter'||e.key===' '){ e.preventDefault(); document.getElementById('dockSummary').click(); }
  });
  document.getElementById('sheetClose').addEventListener('click',closeSheet);
  document.getElementById('btnScenarios').addEventListener('click',()=>openSheet(renderScenarioSheet));
  document.getElementById('btnPrint').addEventListener('click',()=>{ renderPrintReport(computeAll()); window.print(); });
  document.getElementById('themeBtn').addEventListener('click',toggleTheme);
  document.getElementById('brandHome').addEventListener('click',e=>{
    e.preventDefault();
    if(AppState.onboarded) setModule('dashboard');
    else window.scrollTo({top:0,behavior:'smooth'});
  });
  initPalette();
  initSheetDrag();

  document.addEventListener('click',e=>{
    const el=e.target.closest('[data-action]');
    if(el){ e.preventDefault(); runAction(el.dataset.action); }
  });
  document.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){
      e.preventDefault(); togglePalette(); return;
    }
    if(e.key==='Escape'){
      const ov=document.getElementById('cmdOverlay');
      if(!ov.hidden){ closePalette(); return; }
      if(document.getElementById('sheet').classList.contains('open')){ closeSheet(); return; }
      closeSidebar();
    }
  });

  AppState.scenarios=loadScenarios();
  render();
}

  {
    name:'23. Every year computes a finite tax figure (no NaN/Infinity leaks)',
    run(){ return Object.keys(FY_RULES).every(k=>{ const n=calculateNewRegimeTax(1500000,FY_RULES[k]).totalTax; const o=calculateOldRegimeTax(1500000,FY_RULES[k]).totalTax; return isFinite(n)&&isFinite(o)&&n>=0&&o>=0; }) ? 'OK':'BROKEN'; },
    expected:'OK', tolerance:0, isString:true
  },
  {
    name:'24. A fixed monthly PF overrides the statutory 12% end to end',
    run(){ const e=calculateEmployeePF(50000,{fixedMonthly:1800}); const er=calculateEmployerPF(50000,{fixedMonthly:1800}); const s=buildSalaryStructure({basic:50000,da:0,hra:0,specialAllowance:0,lta:0,otherAllowances:0,bonus:0,pfEmployeeMonthly:1800,pfEmployerMonthly:1800}); return e.statutory+'|'+e.fixed+'|'+er.total+'|'+er.fixed+'|'+s.empPF.statutory+'|'+s.erPF.total; },
    expected:'1800|true|1800|true|1800|1800', tolerance:0, isString:true
  }
];

function runTests(){
  return TESTS.map(t=>{
    let actual, pass, error=null;
    try{ actual = t.run(); }
    catch(e){ error = e.message; actual = undefined; }
    if(error){ pass=false; }
    else if(t.isString){ pass = actual===t.expected; }
    else { pass = approxEqual(Number(actual), Number(t.expected), t.tolerance); }
    return { name:t.name, expected:t.expected, actual: error? ('ERROR: '+error) : actual, pass };
  });
}

function renderTestSheet(){
  const results = runTests();
  const passCount = results.filter(r=>r.pass).length;
  document.getElementById('sheetTitle').textContent='Automated test suite';
  document.getElementById('sheetBody').innerHTML = `
    <div class="banner ${passCount===results.length?'':'bad'}">
      <b>${passCount} / ${results.length} tests passed</b>
      <p>Run directly against the live calculation engine in this browser — not a pre-written "all green" report.</p>
    </div>
    <div class="table-wrap"><table class="table-compact"><thead><tr><th>Test</th><th>Expected</th><th>Actual</th><th>Status</th></tr></thead><tbody>
      ${results.map(r=>`<tr class="${r.pass?'good':'bad'}"><td>${escapeHtml(r.name)}</td><td class="num mono">${escapeHtml(String(r.expected))}</td><td class="num mono">${escapeHtml(String(r.actual))}</td><td>${r.pass?'PASS':'FAIL'}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="btn-row" style="margin-top:10px"><button class="btn" id="btnRerunTests">Re-run tests</button></div>
  `;
  const rerun=document.getElementById('btnRerunTests');
  if(rerun) rerun.addEventListener('click', renderTestSheet);
}

</script></body>
