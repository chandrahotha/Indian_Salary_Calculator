<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Salary Studio — Indian Salary &amp; Tax Calculator</title>
<meta name="description" content="Salary Studio is an offline single-file Indian salary calculator: CTC, gross, net, income tax (old and new regime), HRA, PF, ESI, professional tax, payslips, gratuity, offers and freelancer income.">
<meta name="theme-color" content="#f6f7ff" id="themeColorMeta">
<script>
/* Set the theme before first paint so dark mode never flashes light. */
(function(){
  try{
    var t = localStorage.getItem('salary-studio-theme');
    if(!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t==='dark'?'dark':'light');
  }catch(e){}
})();
</script>
<style>
/* ============================================================
   SALARY STUDIO — design system
   A vivid, glass-and-aurora product UI for the Indian salary
   and tax calculator. Light + dark, colour-coded modules,
   precision controls, drag gestures, and a single-file build.
   ============================================================ */

:root{
  color-scheme: light;
  --bg:#f6f7ff;
  --bg-2:#eef0ff;
  --surface:rgba(255,255,255,.76);
  --surface-solid:#ffffff;
  --surface-2:#f4f3ff;
  --surface-3:#ecebff;
  --ink:#14122b;
  --ink-2:#3d3a5e;
  --muted:#6f6b8f;
  --line:rgba(92,74,160,.13);
  --line-strong:rgba(92,74,160,.24);
  --shadow-sm:0 1px 2px rgba(38,22,92,.05);
  --shadow:0 16px 40px -18px rgba(54,32,122,.22),0 2px 8px rgba(54,32,122,.05);
  --shadow-lg:0 36px 90px -30px rgba(54,32,122,.36);
  --radius:22px;
  --radius-sm:16px;
  --radius-xs:11px;
  --radius-pill:999px;
  --font:"Segoe UI Variable Display","Segoe UI Variable","Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Code","SF Mono",ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
  --violet:#8b5cf6;
  --violet-deep:#6d28d9;
  --fuchsia:#d946ef;
  --pink:#ec4899;
  --rose:#f43f5e;
  --orange:#f97316;
  --amber:#f59e0b;
  --lime:#84cc16;
  --emerald:#10b981;
  --teal:#14b8a6;
  --cyan:#06b6d4;
  --sky:#0ea5e9;
  --blue:#3b82f6;
  --indigo:#6366f1;
  --slate:#64748b;
  --good:#047857;
  --good-soft:#d9fbe9;
  --warn:#b45309;
  --warn-soft:#fff2d1;
  --bad:#be123c;
  --bad-soft:#ffe2e8;
  --info:#1d4ed8;
  --info-soft:#e2ebff;
  --tap:44px;
  --topbar-h:66px;
}

[data-theme="dark"]{
  color-scheme: dark;
  --bg:#080712;
  --bg-2:#0d0a1b;
  --surface:rgba(22,19,44,.72);
  --surface-solid:#151230;
  --surface-2:#1b1740;
  --surface-3:#241f52;
  --ink:#f6f3ff;
  --ink-2:#d3cdee;
  --muted:#a09ac5;
  --line:rgba(165,146,255,.14);
  --line-strong:rgba(165,146,255,.26);
  --shadow-sm:0 1px 2px rgba(0,0,0,.35);
  --shadow:0 20px 60px -24px rgba(0,0,0,.8),0 2px 10px rgba(0,0,0,.3);
  --shadow-lg:0 44px 110px -30px rgba(0,0,0,.9);
  --good:#6ee7b7;
  --good-soft:#083b2c;
  --warn:#fcd34d;
  --warn-soft:#3c2a05;
  --bad:#fda4af;
  --bad-soft:#4c1020;
  --info:#93c5fd;
  --info-soft:#122a55;
}

/* ---------- tones ---------- */
[data-tone="violet"]{--mod:#8b5cf6;--mod-2:#c084fc}
[data-tone="indigo"]{--mod:#6366f1;--mod-2:#818cf8}
[data-tone="blue"]{--mod:#3b82f6;--mod-2:#60a5fa}
[data-tone="sky"]{--mod:#0ea5e9;--mod-2:#38bdf8}
[data-tone="cyan"]{--mod:#06b6d4;--mod-2:#22d3ee}
[data-tone="teal"]{--mod:#14b8a6;--mod-2:#2dd4bf}
[data-tone="emerald"]{--mod:#10b981;--mod-2:#34d399}
[data-tone="mint"]{--mod:#2dd4bf;--mod-2:#5eead4}
[data-tone="lime"]{--mod:#84cc16;--mod-2:#a3e635}
[data-tone="gold"]{--mod:#eab308;--mod-2:#facc15}
[data-tone="amber"]{--mod:#f59e0b;--mod-2:#fbbf24}
[data-tone="orange"]{--mod:#f97316;--mod-2:#fb923c}
[data-tone="rose"]{--mod:#f43f5e;--mod-2:#fb7185}
[data-tone="fuchsia"]{--mod:#d946ef;--mod-2:#e879f9}
[data-tone="slate"]{--mod:#64748b;--mod-2:#94a3b8}
[data-tone]{
  --mod-soft:color-mix(in srgb,var(--mod) 11%,var(--surface-solid));
  --mod-mist:color-mix(in srgb,var(--mod) 18%,transparent);
  --mod-glow:color-mix(in srgb,var(--mod) 32%,transparent);
  --mod-ink:color-mix(in srgb,var(--mod) 70%,#1b1035);
}
[data-theme="dark"] [data-tone]{
  --mod-soft:color-mix(in srgb,var(--mod) 18%,var(--surface-solid));
  --mod-mist:color-mix(in srgb,var(--mod) 24%,transparent);
  --mod-glow:color-mix(in srgb,var(--mod) 40%,transparent);
  --mod-ink:color-mix(in srgb,var(--mod) 76%,#fff);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
body.no-scroll{overflow:hidden}
h1,h2,h3,h4{margin:0;letter-spacing:-.025em;line-height:1.2}
p{margin:0 0 10px}
a{color:var(--mod-ink,var(--violet-deep));text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;background:none;border:0}
img,svg{display:block}
::selection{background:color-mix(in srgb,var(--violet) 28%,transparent);color:var(--ink)}
:focus-visible{outline:3px solid color-mix(in srgb,var(--violet) 70%,transparent);outline-offset:3px;border-radius:8px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:-9999px;top:0;background:var(--ink);color:#fff;padding:11px 16px;z-index:300;border-radius:0 0 12px 0}
.skip:focus{left:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.nowrap{white-space:nowrap}
.icon-svg{flex:none;vertical-align:-2px;width:16px;height:16px;stroke-width:1.9}

/* ---------- living background ---------- */
.aurora{position:fixed;inset:-20vh -10vw;z-index:-2;pointer-events:none;overflow:hidden;filter:blur(64px) saturate(1.35);opacity:.74}
.aurora i{position:absolute;display:block;border-radius:50%;mix-blend-mode:multiply;will-change:transform}
.aurora i:nth-child(1){width:52vw;height:52vw;left:-8vw;top:-10vh;background:radial-gradient(circle at 40% 40%,#c4b5fd,#8b5cf6 55%,transparent 70%);animation:drift-a 22s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:46vw;height:46vw;right:-6vw;top:-4vh;background:radial-gradient(circle at 50% 50%,#fbcfe8,#ec4899 55%,transparent 72%);animation:drift-b 26s ease-in-out infinite alternate}
.aurora i:nth-child(3){width:42vw;height:42vw;left:18vw;bottom:-16vh;background:radial-gradient(circle at 50% 50%,#a5f3fc,#06b6d4 55%,transparent 72%);animation:drift-c 30s ease-in-out infinite alternate}
.aurora i:nth-child(4){width:32vw;height:32vw;right:16vw;bottom:2vh;background:radial-gradient(circle at 50% 50%,#fed7aa,#f97316 55%,transparent 72%);animation:drift-d 24s ease-in-out infinite alternate}
[data-theme="dark"] .aurora{opacity:.38;filter:blur(90px) saturate(1.2)}
[data-theme="dark"] .aurora i{mix-blend-mode:screen}
.bg-grid{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.34;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 10%,transparent 75%)}
[data-theme="dark"] .bg-grid{opacity:.18}
@keyframes drift-a{to{transform:translate3d(7vw,5vh,0) scale(1.08)}}
@keyframes drift-b{to{transform:translate3d(-6vw,7vh,0) scale(1.12)}}
@keyframes drift-c{to{transform:translate3d(5vw,-6vh,0) scale(.94)}}
@keyframes drift-d{to{transform:translate3d(-7vw,-4vh,0) scale(1.06)}}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:70;
  display:flex;align-items:center;gap:10px;
  min-height:var(--topbar-h);
  padding:10px clamp(12px,2.4vw,22px);
  background:color-mix(in srgb,var(--bg) 72%,transparent);
  backdrop-filter:blur(22px) saturate(1.5);
  -webkit-backdrop-filter:blur(22px) saturate(1.5);
  border-bottom:1px solid var(--line);
}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--violet) 45%,transparent),color-mix(in srgb,var(--pink) 45%,transparent),transparent);opacity:.8}
.brand{display:flex;align-items:center;gap:11px;min-width:0;color:var(--ink);text-decoration:none}
.brand:hover{text-decoration:none}
.brand-mark{
  position:relative;width:40px;height:40px;border-radius:14px;flex:none;
  display:grid;place-items:center;color:#fff;
  background:conic-gradient(from 210deg,#7c3aed,#d946ef,#f97316,#06b6d4,#7c3aed);
  box-shadow:0 8px 22px -8px rgba(124,58,237,.75),inset 0 0 0 1px rgba(255,255,255,.24);
  overflow:hidden;
}
.brand-mark::before{content:"";position:absolute;inset:2px;border-radius:12px;background:linear-gradient(145deg,rgba(255,255,255,.28),rgba(255,255,255,.04));backdrop-filter:blur(2px)}
.brand-mark svg{position:relative;z-index:1;width:23px;height:23px}
.brand-text{display:flex;flex-direction:column;line-height:1.08;min-width:0}
.brand-name{font-size:16.5px;font-weight:800;letter-spacing:-.035em;white-space:nowrap}
.brand-name em{font-style:normal;background:linear-gradient(100deg,var(--violet),var(--pink) 55%,var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-sub{font-size:10px;color:var(--muted);font-weight:650;letter-spacing:.09em;text-transform:uppercase;margin-top:3px;white-space:nowrap}
.topbar-spacer{flex:1}
.cmd-btn{
  display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 10px 0 11px;
  border:1px solid var(--line-strong);border-radius:12px;
  background:color-mix(in srgb,var(--surface-solid) 55%,transparent);
  color:var(--muted);font-size:12.5px;font-weight:600;
  transition:border-color .16s,color .16s,background .16s,box-shadow .16s;
}
.cmd-btn:hover{border-color:color-mix(in srgb,var(--violet) 45%,transparent);color:var(--ink);background:var(--surface-solid);box-shadow:var(--shadow-sm)}
.cmd-btn .icon-svg{color:var(--violet)}
.cmd-btn kbd{display:inline-grid;place-items:center;min-width:21px;height:21px;padding:0 5px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);font:600 10px/1 var(--mono)}
.compact-select{
  height:38px;max-width:142px;padding:0 30px 0 11px;border-radius:11px;
  border:1px solid var(--line-strong);
  background:color-mix(in srgb,var(--surface-solid) 72%,transparent);
  color:var(--ink);font-size:12.5px;font-weight:700;
  appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 16px,calc(100% - 10px) 16px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
  transition:border-color .16s,box-shadow .16s;
}
.compact-select:hover{border-color:color-mix(in srgb,var(--violet) 45%,transparent)}
.compact-select:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 4px color-mix(in srgb,var(--violet) 18%,transparent)}
.regime-toggle{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-pill);padding:3px;gap:2px}
.regime-toggle button{border:0;background:transparent;color:var(--muted);font-weight:750;font-size:12px;padding:0 13px;border-radius:var(--radius-pill);min-height:31px;transition:color .16s,background .16s,box-shadow .16s}
.regime-toggle button:hover{color:var(--ink)}
.regime-toggle button.active{background:linear-gradient(120deg,var(--violet),var(--fuchsia));color:#fff;box-shadow:0 6px 16px -8px rgba(139,92,246,.9)}
.icon-btn{
  display:inline-flex;align-items:center;justify-content:center;flex:none;
  width:40px;height:40px;border-radius:12px;
  border:1px solid var(--line-strong);
  background:color-mix(in srgb,var(--surface-solid) 68%,transparent);
  color:var(--ink-2);
  transition:border-color .16s,color .16s,background .16s,transform .08s,box-shadow .16s;
}
.icon-btn:hover{border-color:color-mix(in srgb,var(--violet) 48%,transparent);color:var(--violet);background:var(--surface-solid);box-shadow:var(--shadow-sm)}
.icon-btn:active{transform:scale(.96)}
.theme-btn .icon-svg{width:18px;height:18px}
.menu-btn{display:none}

/* ---------- shell ---------- */
.shell{display:block;min-height:calc(100vh - var(--topbar-h));padding-bottom:calc(92px + env(safe-area-inset-bottom))}
#main{
  padding:26px clamp(20px,3.6vw,40px) 46px;
  max-width:1280px;margin:0 auto;min-width:0;outline:none;
}
.view{min-width:0}
.sidebar{
  position:fixed;inset:0 auto 0 0;width:min(88vw,292px);
  background:color-mix(in srgb,var(--surface-solid) 82%,transparent);
  backdrop-filter:blur(26px) saturate(1.4);
  border-right:1px solid var(--line);
  z-index:90;transform:translateX(-103%);
  transition:transform .26s cubic-bezier(.22,.8,.25,1);
  overflow-y:auto;padding:18px 13px 26px;
  box-shadow:var(--shadow-lg);
}
.sidebar.open{transform:translateX(0)}
.sidebar-head{display:flex;align-items:center;justify-content:space-between;padding:0 6px 14px}
.sidebar-title{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800}
.nav{display:flex;flex-direction:column;gap:4px}
.nav-group{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800;padding:16px 9px 5px}
.nav-group:first-child{padding-top:0}
.nav button{
  position:relative;display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  border:1px solid transparent;background:transparent;color:var(--ink-2);
  padding:9px 10px;border-radius:13px;font-weight:650;font-size:13.5px;min-height:44px;
  transition:background .16s,border-color .16s,color .16s,transform .08s;
}
.nav button .icon-svg{width:17px;height:17px;color:var(--mod);opacity:.9}
.nav button .nav-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button .nav-dot{width:6px;height:6px;border-radius:50%;background:var(--mod);opacity:0;transform:scale(.4);transition:.16s}
.nav button:hover{background:var(--surface-2);color:var(--ink);border-color:var(--line)}
.nav button:hover .nav-dot{opacity:.55;transform:none}
.nav button.active{
  background:linear-gradient(100deg,var(--mod-soft),color-mix(in srgb,var(--mod-soft) 30%,transparent));
  color:var(--mod-ink);border-color:color-mix(in srgb,var(--mod) 25%,transparent);
  box-shadow:0 6px 18px -12px var(--mod-glow);
}
.nav button.active .icon-svg{color:var(--mod)}
.nav button.active .nav-dot{opacity:1;transform:none}
.nav button.active::before{content:"";position:absolute;left:-13px;top:10px;bottom:10px;width:3px;border-radius:0 4px 4px 0;background:linear-gradient(var(--mod),var(--mod-2))}
.nav-more{margin-top:4px}
.nav-more>summary{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:12px;color:var(--muted);font-size:12px;font-weight:750;cursor:pointer;list-style:none;min-height:42px}
.nav-more>summary::-webkit-details-marker{display:none}
.nav-more>summary:hover{background:var(--surface-2);color:var(--ink)}
.nav-more[open]>summary{color:var(--ink-2)}
.sidebar-foot{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.sidebar-foot .btn{justify-content:flex-start;width:100%}
.sidebar-note{margin-top:10px;padding:10px 11px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);font-size:10.5px;line-height:1.45;display:flex;align-items:center;gap:7px}
.sidebar-note .icon-svg{width:14px;height:14px;color:var(--emerald)}
.backdrop{position:fixed;inset:0;background:rgba(9,6,24,.48);backdrop-filter:blur(3px);z-index:85;opacity:0;pointer-events:none;transition:opacity .22s}
.backdrop.show{opacity:1;pointer-events:auto}

/* ---------- right rail + mobile dock ---------- */
.dock{display:none}
.mobile-dock{
  position:fixed;left:0;right:0;bottom:0;z-index:75;
  background:color-mix(in srgb,var(--surface-solid) 88%,transparent);
  backdrop-filter:blur(22px) saturate(1.5);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -18px 40px -26px rgba(40,20,90,.35);
}
.dock-summary{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:9px 15px 7px;text-align:left}
.dock-label{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
.dock-value{font-family:var(--mono);font-weight:800;font-size:16px;color:var(--emerald);font-variant-numeric:tabular-nums}
.dock-sub{margin-left:auto;font-size:10.5px;color:var(--muted);font-weight:650}
.dock-chev{color:var(--muted);display:inline-flex}
.dock-chev .icon-svg{width:15px;height:15px}
.dock-tabs{display:flex;gap:3px;padding:3px 6px 7px;overflow-x:auto;scrollbar-width:none}
.dock-tabs::-webkit-scrollbar{display:none}
.dock-tabs button{
  flex:1 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  min-width:58px;min-height:48px;border-radius:12px;border:1px solid transparent;
  color:var(--muted);font-size:9.5px;font-weight:750;padding:5px 4px;
  transition:background .16s,color .16s,border-color .16s;
}
.dock-tabs button .icon-svg{width:18px;height:18px;color:var(--mod)}
.dock-tabs button.active{background:var(--mod-soft);color:var(--mod-ink);border-color:color-mix(in srgb,var(--mod) 24%,transparent)}
.dock-tabs button:active{transform:scale(.97)}

/* ---------- page head ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:18px;flex-wrap:wrap}
.page-head-copy{min-width:0}
.eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--emerald);box-shadow:0 0 0 4px color-mix(in srgb,var(--emerald) 18%,transparent);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px color-mix(in srgb,var(--emerald) 16%,transparent)}50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--emerald) 4%,transparent)}}
.section-title{font-size:clamp(27px,3.4vw,42px);font-weight:800;letter-spacing:-.045em;line-height:1.04;color:var(--ink)}
.module-head{display:inline-flex;align-items:center;gap:12px;max-width:100%}
.module-icon{
  display:inline-grid;place-items:center;flex:none;
  width:clamp(38px,4vw,48px);height:clamp(38px,4vw,48px);border-radius:15px;
  color:#fff;background:linear-gradient(145deg,var(--mod),var(--mod-2));
  box-shadow:0 12px 26px -12px var(--mod-glow),inset 0 0 0 1px rgba(255,255,255,.24);
}
.module-icon .icon-svg{width:22px;height:22px;stroke-width:2}
.module-title-text{min-width:0}
.section-intro{color:var(--muted);font-size:14px;line-height:1.6;margin:10px 0 0;max-width:78ch}
.page-actions{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:3px;margin-left:auto}
.section-head-space{height:14px}

/* ---------- layout grids ---------- */
.grid{display:grid;gap:16px}
.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
.split-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;align-items:center}
@media(min-width:700px){
  .grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
/* Field grids inside a narrow card fall back to one column. A card in the
   three-column desktop shell is only ~400px wide, so two 170px fields with
   labels like "80C investments (PPF, ELSS, EPF, life insurance)" wrap
   unevenly and knock the steppers out of line. Container queries let the
   card decide for itself instead of guessing from the window width. */
.card{container-type:inline-size}
@container (max-width:520px){
  .field-grid.grid-2{grid-template-columns:minmax(0,1fr)}
}
@media(min-width:1200px){
  .split-grid.wide{grid-template-columns:190px minmax(0,1fr);gap:22px;align-items:center}
  .split-grid.wide .donut-wrap{width:190px}
}
@media(min-width:1100px){
  .grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
}



/* ---------- cards ---------- */
.card{
  position:relative;min-width:0;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:20px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(18px) saturate(1.25);
  -webkit-backdrop-filter:blur(18px) saturate(1.25);
  margin:0 0 16px;
  overflow:hidden;
}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--mod),var(--mod-2) 45%,transparent 82%);opacity:.72}
.card::after{content:"";position:absolute;right:-44px;top:-54px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,var(--mod-mist),transparent 70%);opacity:.7;pointer-events:none}
.card>*{position:relative;z-index:1}
.grid>.card,.grid>*>.card{margin-bottom:0}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.card-title-wrap{display:flex;align-items:flex-start;gap:10px;min-width:0}
.card-ico{display:inline-grid;place-items:center;flex:none;width:32px;height:32px;border-radius:10px;background:var(--mod-soft);color:var(--mod-ink);border:1px solid color-mix(in srgb,var(--mod) 20%,transparent)}
.card-ico .icon-svg{width:16px;height:16px}
.card h3{font-size:15.5px;font-weight:780;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.card .sub{color:var(--muted);font-size:12px;margin:3px 0 0;line-height:1.45}
.card .card-body{margin-top:2px}
.card-note{margin-top:12px;padding-top:11px;border-top:1px dashed var(--line-strong);font-size:11.5px;color:var(--muted);line-height:1.5}
.card-flush{padding:0}
.card-flush .card-inner{padding:20px}
.empty{text-align:center;padding:34px 18px;color:var(--muted);font-size:13px}
.empty .icon-svg{width:34px;height:34px;margin:0 auto 10px;color:var(--mod);opacity:.7}
.empty-cta{text-align:center;padding:10px 8px 4px}
.empty-cta p{color:var(--muted);font-size:13px;max-width:44ch;margin:0 auto 15px}

/* ---------- KPI tiles ---------- */
.kpi{
  position:relative;min-width:0;overflow:hidden;
  border:1px solid color-mix(in srgb,var(--mod) 18%,transparent);
  border-radius:var(--radius-sm);
  background:linear-gradient(155deg,var(--mod-soft),var(--surface-solid) 72%);
  padding:15px 16px 14px;
  box-shadow:var(--shadow-sm);
}
.kpi .lbl{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800;display:flex;align-items:center;gap:6px}
.kpi .val{font-family:var(--mono);font-size:clamp(20px,2.5vw,27px);font-weight:800;margin-top:6px;letter-spacing:-.045em;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1.12}
.kpi .sub{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.4}
.kpi .kpi-ico{position:absolute;right:13px;top:13px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--mod) 14%,transparent);color:var(--mod-ink)}
.kpi .kpi-ico .icon-svg{width:15px;height:15px}
.kpi.accent{--mod:#10b981;--mod-2:#34d399}
.kpi.danger{--mod:#f43f5e;--mod-2:#fb7185}
[data-theme="dark"] .kpi.accent{--mod:#34d399;--mod-2:#6ee7b7}
[data-theme="dark"] .kpi.danger{--mod:#fb7185;--mod-2:#fda4af}
.kpi.accent,.kpi.danger{--mod-soft:color-mix(in srgb,var(--mod) 11%,var(--surface-solid));--mod-ink:color-mix(in srgb,var(--mod) 70%,#1b1035);--mod-mist:color-mix(in srgb,var(--mod) 18%,transparent);--mod-glow:color-mix(in srgb,var(--mod) 32%,transparent)}
[data-theme="dark"] .kpi.accent,[data-theme="dark"] .kpi.danger{--mod-soft:color-mix(in srgb,var(--mod) 18%,var(--surface-solid));--mod-ink:color-mix(in srgb,var(--mod) 76%,#fff)}

/* ---------- hero cards ---------- */
.pay-hero{
  position:relative;overflow:hidden;
  display:grid;grid-template-columns:1.15fr .85fr;gap:22px;
  border-radius:28px;padding:26px;
  color:#fff;
  background:
    radial-gradient(700px 320px at 88% 4%,rgba(251,146,60,.62),transparent 60%),
    radial-gradient(560px 300px at 4% 92%,rgba(217,70,239,.55),transparent 62%),
    linear-gradient(118deg,#3b0764 0%,#5b21b6 32%,#a21caf 64%,#ea580c 100%);
  box-shadow:0 34px 80px -34px rgba(109,40,217,.7),inset 0 0 0 1px rgba(255,255,255,.14);
  margin-bottom:16px;
}
.pay-hero::before{content:"";position:absolute;inset:0;background:
  radial-gradient(circle at 78% 22%,rgba(255,255,255,.18) 0 1.5px,transparent 2px) 0 0/22px 22px;
  opacity:.5;pointer-events:none}
.pay-hero::after{content:"";position:absolute;right:-120px;bottom:-190px;width:480px;height:480px;border:1px solid rgba(255,255,255,.18);border-radius:50%;box-shadow:0 0 0 34px rgba(255,255,255,.05),0 0 0 70px rgba(255,255,255,.03);pointer-events:none}
.pay-hero-main,.pay-hero-side{position:relative;z-index:1;min-width:0}
.ph-label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.72);font-weight:800;display:flex;align-items:center;gap:8px}
.ph-label .live-dot{background:#a7f3d0;box-shadow:0 0 0 4px rgba(167,243,208,.16)}
.ph-value{font-family:var(--font);font-size:clamp(40px,6vw,66px);font-weight:800;letter-spacing:-.055em;line-height:1;margin:8px 0 6px;font-variant-numeric:tabular-nums;text-shadow:0 10px 30px rgba(0,0,0,.18)}
.ph-sub{font-size:13px;color:rgba(255,255,255,.82);line-height:1.5}
.ph-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.ph-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:10.5px;font-weight:750;backdrop-filter:blur(8px)}
.ph-chip .dot{width:6px;height:6px;border-radius:50%;background:#a7f3d0}
.pay-hero-side{display:flex;flex-direction:column;justify-content:center;gap:12px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:16px;backdrop-filter:blur(10px)}
.ph-flow-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:11.5px;color:rgba(255,255,255,.76)}
.ph-flow-row b{font-family:var(--mono);font-size:13px;color:#fff;font-variant-numeric:tabular-nums}
.ph-flow-row.total b{font-size:16px}
.flow-bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.12);margin:10px 0 9px}
.flow-bar span{display:block;height:100%;min-width:2px}
.flow-legend{display:flex;flex-wrap:wrap;gap:6px 12px}
.flow-legend span{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:rgba(255,255,255,.76);font-weight:650}
.flow-legend i{width:7px;height:7px;border-radius:50%;display:inline-block}
.ph-mini{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:10.5px;color:rgba(255,255,255,.66);border-top:1px solid rgba(255,255,255,.14);padding-top:9px;margin-top:1px}

/* intake result card */
.result-card{
  position:relative;overflow:hidden;border-radius:26px;padding:24px;color:#fff;
  background:
    radial-gradient(520px 260px at 90% 0%,rgba(251,191,36,.45),transparent 60%),
    radial-gradient(500px 300px at 0% 100%,rgba(236,72,153,.5),transparent 62%),
    linear-gradient(150deg,#1e1b4b 0%,#4c1d95 34%,#7e22ce 62%,#be185d 100%);
  box-shadow:0 30px 70px -28px rgba(76,29,149,.75),inset 0 0 0 1px rgba(255,255,255,.12);
  position:sticky;top:calc(var(--topbar-h) + 16px);
}
.result-card::before{content:"";position:absolute;right:-90px;top:-110px;width:300px;height:300px;border-radius:50%;border:1px solid rgba(255,255,255,.2);box-shadow:0 0 0 32px rgba(255,255,255,.05),0 0 0 64px rgba(255,255,255,.03);pointer-events:none}
.result-card>*{position:relative;z-index:1}
.rc-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.rc-label{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.7);font-weight:800}
.rc-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);font-size:9.5px;font-weight:750;color:#fff}
.rc-badge .live-dot{width:5px;height:5px;box-shadow:none;background:#a7f3d0}
.rc-hero{font-family:var(--font);font-size:clamp(34px,5.4vw,48px);font-weight:800;letter-spacing:-.055em;line-height:1.02;font-variant-numeric:tabular-nums;text-shadow:0 10px 28px rgba(0,0,0,.2)}
.rc-sub{font-size:12.5px;color:rgba(255,255,255,.8);margin-top:6px;line-height:1.45}
.rc-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.rc-chip{padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);font-size:9.5px;font-weight:700;color:rgba(255,255,255,.9)}
.rc-split{height:1px;background:rgba(255,255,255,.16);margin:16px 0 8px}
.rc-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:5px 0;font-size:12.5px}
.rc-row .k{color:rgba(255,255,255,.68);display:flex;align-items:center;gap:7px}
.rc-row .k i{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.rc-row .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap;color:#fff}
.rc-row.pos .v{color:#86efac}
.rc-row.neg .v{color:#fecdd3}
.rc-foot{font-size:10.5px;color:rgba(255,255,255,.62);margin-top:14px;line-height:1.55;border-top:1px solid rgba(255,255,255,.13);padding-top:12px}
.rc-empty{padding:22px 0 8px}
.rc-empty .rc-empty-icon{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);color:#fff;margin-bottom:12px}
.rc-empty p{font-size:13px;color:rgba(255,255,255,.82);line-height:1.6;margin:0}
.rc-empty small{display:block;margin-top:10px;font-size:10.5px;color:rgba(255,255,255,.55)}
.rc-skeleton{display:grid;gap:9px;margin-top:18px}
.rc-skeleton span{display:block;height:9px;border-radius:999px;background:rgba(255,255,255,.14)}
.rc-skeleton span:nth-child(2){width:76%}
.rc-skeleton span:nth-child(3){width:52%}

/* ---------- banner / rules strip ---------- */
.fy-banner{margin-bottom:16px}
.rule-strip{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:10px 14px;border-radius:15px;
  border:1px solid var(--line);
  background:color-mix(in srgb,var(--surface-solid) 62%,transparent);
  backdrop-filter:blur(12px);
  box-shadow:var(--shadow-sm);
}
.rule-strip-main{display:flex;align-items:center;gap:10px;min-width:0}
.rule-ico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--mod-soft);color:var(--mod-ink);flex:none}
.rule-ico .icon-svg{width:16px;height:16px}
.rule-copy{display:flex;flex-direction:column;min-width:0}
.rule-copy b{font-size:12px;font-weight:800;letter-spacing:-.01em}
.rule-copy span{font-size:10.5px;color:var(--muted)}
.rule-strip-side{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.banner{
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  border:1px solid var(--line);border-left:4px solid var(--mod);
  background:color-mix(in srgb,var(--mod) 7%,var(--surface-solid));
  border-radius:14px;padding:11px 14px;margin-bottom:14px;font-size:12.5px;
}
.banner.warn{border-left-color:var(--warn);background:color-mix(in srgb,var(--warn) 8%,var(--surface-solid))}
.banner.bad{border-left-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--surface-solid));color:var(--ink)}
.banner.good{border-left-color:var(--emerald);background:color-mix(in srgb,var(--emerald) 8%,var(--surface-solid))}
.banner b{font-weight:800}
.banner p{margin:3px 0 0;font-size:11.5px;color:var(--muted);line-height:1.5}
.banner-line{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.banner-meta{font-size:10.5px;color:var(--muted)}
.b-details{margin-top:2px}
.b-details>summary{font-size:10.5px;padding:5px 7px;cursor:pointer;list-style:none;color:var(--muted);border-radius:7px}
.b-details>summary:hover{background:var(--surface-2);color:var(--ink)}
.b-details>summary::-webkit-details-marker{display:none}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border:1px solid var(--line-strong);
  background:color-mix(in srgb,var(--surface-solid) 72%,transparent);
  color:var(--ink);padding:0 15px;border-radius:12px;
  font-weight:720;font-size:13.5px;min-height:42px;line-height:1.2;
  box-shadow:var(--shadow-sm);
  transition:background .16s,border-color .16s,box-shadow .16s,transform .08s,color .16s;
}
.btn .icon-svg{width:15px;height:15px}
.btn:hover{border-color:color-mix(in srgb,var(--violet) 45%,transparent);background:var(--surface-solid);box-shadow:0 8px 20px -12px rgba(76,29,149,.3)}
.btn:active{transform:translateY(1px) scale(.995)}
.btn.primary{
  background:linear-gradient(120deg,var(--violet-deep),var(--violet) 45%,var(--fuchsia));
  border-color:transparent;color:#fff;
  box-shadow:0 14px 28px -12px rgba(124,58,237,.72),inset 0 0 0 1px rgba(255,255,255,.16);
}
.btn.primary:hover{filter:saturate(1.08) brightness(1.04);box-shadow:0 18px 36px -14px rgba(124,58,237,.78)}
.btn.danger{background:linear-gradient(120deg,#be123c,#f43f5e);border-color:transparent;color:#fff;box-shadow:0 12px 24px -14px rgba(244,63,94,.7)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.sm{padding:0 11px;font-size:12px;min-height:36px;border-radius:10px}
.btn.sm .icon-svg{width:13px;height:13px}
.btn.row{width:100%}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn[disabled]{opacity:.48;cursor:not-allowed;transform:none;box-shadow:none}
.btn[disabled]:hover{border-color:var(--line-strong);background:color-mix(in srgb,var(--surface-solid) 72%,transparent)}

/* ---------- chips / badges ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:10px;font-weight:800;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);white-space:nowrap;line-height:1.5}
.chip.ok{background:color-mix(in srgb,var(--emerald) 13%,var(--surface-solid));color:var(--good);border-color:color-mix(in srgb,var(--emerald) 30%,transparent)}
.chip.warn{background:color-mix(in srgb,var(--amber) 14%,var(--surface-solid));color:var(--warn);border-color:color-mix(in srgb,var(--amber) 34%,transparent)}
.chip.info{background:color-mix(in srgb,var(--blue) 12%,var(--surface-solid));color:var(--info);border-color:color-mix(in srgb,var(--blue) 28%,transparent)}
.chip.rose{background:color-mix(in srgb,var(--rose) 12%,var(--surface-solid));color:var(--bad);border-color:color-mix(in srgb,var(--rose) 28%,transparent)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:7px;font-size:10px;font-weight:750;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line-strong)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}

/* ---------- forms ---------- */
.field{margin-bottom:14px;min-width:0;display:flex;flex-direction:column}
/* Controls sit at the bottom of their grid row, so a two-line label in one
   column never pushes its stepper out of line with the column beside it. */
.field>.stepper,.field>select,.field>input,.field>.check{margin-top:auto}
.field label:not(.check),.field .lbl{display:flex;align-items:center;gap:6px;font-weight:700;font-size:11.5px;margin-bottom:6px;color:var(--ink-2);letter-spacing:.005em;min-height:2.6em;align-items:flex-start;line-height:1.3}
.field label.has-pretty{justify-content:space-between;gap:10px;flex-wrap:wrap}
.field .lbl-text{min-width:0}
.field-pretty{font-family:var(--mono);font-size:9.5px;font-weight:800;letter-spacing:0;color:var(--mod-ink);background:var(--mod-soft);border:1px solid color-mix(in srgb,var(--mod) 20%,transparent);padding:1px 6px;border-radius:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.field input,.field select,.field textarea{
  width:100%;min-height:44px;padding:10px 12px;
  border:1px solid var(--line-strong);border-radius:13px;
  background:color-mix(in srgb,var(--surface-solid) 80%,transparent);
  color:var(--ink);font-size:14.5px;
  transition:border-color .16s,box-shadow .16s,background .16s;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--mod);box-shadow:0 0 0 4px var(--mod-soft);background:var(--surface-solid)}
.field input.invalid{border-color:var(--bad);box-shadow:0 0 0 4px color-mix(in srgb,var(--bad) 16%,transparent)}
.field input::placeholder,.field textarea::placeholder{color:color-mix(in srgb,var(--muted) 75%,transparent)}
.field-row{display:grid;gap:0}
.field select{
  appearance:none;padding-right:34px;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}
.hint{font-size:10.5px;color:var(--muted);line-height:1.5;margin-top:5px}
.field .hint{margin-top:5px}
.check{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface-solid) 64%,transparent);border-radius:12px;padding:9px 11px;font-size:12px;font-weight:600;min-height:46px;cursor:pointer;transition:border-color .16s,background .16s;line-height:1.3;text-align:left;box-sizing:border-box}
.check:hover{border-color:var(--line-strong);background:var(--surface-solid)}
.check input{width:17px;height:17px;min-height:0;flex:none;accent-color:var(--violet);cursor:pointer}
.inline-checks{display:flex;flex-wrap:wrap;gap:8px}
.divider{height:1px;background:linear-gradient(90deg,var(--line),transparent);margin:14px 0}

/* precision steppers */
.stepper{
  display:grid;grid-template-columns:42px minmax(0,1fr) 42px;align-items:stretch;
  border:1px solid var(--line-strong);border-radius:13px;overflow:hidden;
  background:color-mix(in srgb,var(--surface-solid) 80%,transparent);
  transition:border-color .16s,box-shadow .16s,background .16s;
}
.stepper:focus-within{border-color:var(--mod);box-shadow:0 0 0 4px var(--mod-soft);background:var(--surface-solid)}
.stepper input[type=number]{
  border:0!important;border-radius:0!important;box-shadow:none!important;background:transparent!important;
  text-align:center;font-family:var(--mono);font-weight:750;font-size:14px;
  min-height:44px;padding:10px 4px;appearance:textfield;-moz-appearance:textfield;
}
.stepper input[type=number]::-webkit-outer-spin-button,.stepper input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.step-btn{
  display:grid;place-items:center;border:0;background:transparent;color:var(--muted);
  font-size:18px;font-weight:500;line-height:1;min-height:44px;
  transition:background .14s,color .14s;
  user-select:none;touch-action:manipulation;
}
.step-btn:hover{background:var(--mod-soft);color:var(--mod-ink)}
.step-btn:active{background:color-mix(in srgb,var(--mod) 18%,transparent)}
.step-btn:first-child{border-right:1px solid var(--line)}
.step-btn:last-child{border-left:1px solid var(--line)}
.step-btn kbd{display:none}

/* segmented control */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:13px;padding:4px}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:750;font-size:12px;padding:9px 8px;border-radius:9px;min-height:38px;transition:background .16s,color .16s,box-shadow .16s}
.seg button[aria-pressed="true"]{background:linear-gradient(120deg,var(--mod),var(--mod-2));color:#fff;box-shadow:0 6px 16px -9px var(--mod-glow)}
.seg button:hover:not([aria-pressed="true"]){color:var(--ink-2)}

/* range */
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:28px;
  background:transparent;cursor:grab;margin:0;touch-action:pan-y;
}
input[type=range]:active{cursor:grabbing}
input[type=range]::-webkit-slider-runnable-track{
  height:8px;border-radius:99px;
  background:linear-gradient(90deg,var(--mod) 0 var(--pct,50%),color-mix(in srgb,var(--mod) 13%,var(--surface-solid)) var(--pct,50%) 100%);
  border:1px solid color-mix(in srgb,var(--mod) 14%,transparent);
}
input[type=range]::-moz-range-track{height:8px;border-radius:99px;background:color-mix(in srgb,var(--mod) 13%,var(--surface-solid))}
input[type=range]::-moz-range-progress{height:8px;border-radius:99px;background:var(--mod)}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:24px;height:24px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff,color-mix(in srgb,var(--mod) 82%,#fff) 58%,var(--mod));
  border:4px solid var(--surface-solid);
  box-shadow:0 2px 8px rgba(30,16,70,.28),0 0 0 1px color-mix(in srgb,var(--mod) 25%,transparent);
  margin-top:-9px;transition:transform .12s;
}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.12)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--mod);border:4px solid var(--surface-solid);box-shadow:0 2px 8px rgba(30,16,70,.28)}
input[type=range]:focus-visible{outline:none}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 5px var(--mod-soft),0 2px 8px rgba(30,16,70,.28)}
.range-field .range-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.range-field .range-head label{margin:0}
.range-val{font-family:var(--mono);font-size:11.5px;font-weight:800;color:var(--mod-ink);background:var(--mod-soft);border:1px solid color-mix(in srgb,var(--mod) 20%,transparent);padding:2px 9px;border-radius:999px;font-variant-numeric:tabular-nums}
.range-wrap{position:relative;padding-top:2px}
.range-scale{display:flex;justify-content:space-between;font-size:9.5px;color:var(--muted);font-weight:650;margin-top:-2px;padding:0 2px}
.range-scale span{white-space:nowrap}

/* intake specific */
.gate-wrap{display:grid;grid-template-columns:1fr;gap:18px;align-items:start;max-width:1120px;margin:0 auto;width:100%}
@media(min-width:960px){.gate-wrap{grid-template-columns:1.08fr .92fr;gap:22px;align-items:center}}
.gate-card{
  position:relative;overflow:hidden;
  background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:clamp(20px,3vw,32px);
  box-shadow:var(--shadow-lg);backdrop-filter:blur(22px) saturate(1.25);
}
.gate-card::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--violet),var(--fuchsia) 38%,var(--orange) 72%,transparent)}
.gate-card::after{content:"";position:absolute;right:-100px;top:-120px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--violet) 16%,transparent),transparent 68%);pointer-events:none}
.gate-card>*{position:relative;z-index:1}
.gate-eyebrow{display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:999px;background:var(--mod-soft);border:1px solid color-mix(in srgb,var(--mod) 22%,transparent);color:var(--mod-ink);font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px}
.gate-eyebrow .live-dot{width:5px;height:5px;box-shadow:none;background:var(--emerald)}
.gate-card h2{font-size:clamp(24px,3vw,34px);font-weight:800;letter-spacing:-.045em;margin:0 0 4px;line-height:1.08}
.gate-card h2 .grad{background:linear-gradient(100deg,var(--violet),var(--fuchsia) 55%,var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent}
.gate-card .lede{font-size:13px;color:var(--muted);margin:0 0 20px;line-height:1.55;max-width:44ch}
.ctc-label{display:flex;align-items:center;justify-content:space-between;font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.ctc-label .ctc-live{display:inline-flex;align-items:center;gap:5px;font-size:9px;letter-spacing:.04em;text-transform:none;color:var(--emerald);font-weight:750}
.ctc-label .ctc-live i{width:5px;height:5px;border-radius:50%;background:var(--emerald);display:inline-block}
.ctc-box{
  display:flex;align-items:baseline;gap:9px;
  border:1.5px solid var(--line-strong);border-radius:18px;padding:14px 16px;
  background:color-mix(in srgb,var(--surface-solid) 82%,transparent);
  transition:border-color .16s,box-shadow .16s,background .16s;
}
.ctc-box:focus-within{border-color:var(--violet);box-shadow:0 0 0 5px color-mix(in srgb,var(--violet) 16%,transparent);background:var(--surface-solid)}
.ctc-box .rupee{font-size:23px;font-weight:800;color:var(--muted);line-height:1;flex:none}
.ctc-box input{
  flex:1;min-width:0;border:0;background:transparent;outline:none;
  font-size:clamp(28px,4.6vw,42px);font-weight:800;letter-spacing:-.05em;
  font-family:var(--font);font-variant-numeric:tabular-nums;color:var(--ink);padding:0;
}
.ctc-box input::placeholder{color:color-mix(in srgb,var(--muted) 42%,transparent)}
.ctc-box .suffix{font-size:11px;font-weight:800;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;background:var(--surface-2);padding:4px 8px;border-radius:7px;border:1px solid var(--line)}
.preset-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.preset{
  border:1px solid var(--line);background:color-mix(in srgb,var(--surface-solid) 60%,transparent);
  color:var(--muted);font-size:10.5px;font-weight:750;padding:5px 10px;border-radius:999px;min-height:30px;
  transition:background .15s,color .15s,border-color .15s,transform .08s;
}
.preset:hover{background:var(--mod-soft);color:var(--mod-ink);border-color:color-mix(in srgb,var(--mod) 28%,transparent)}
.preset:active{transform:scale(.97)}
.preset.active{background:linear-gradient(120deg,var(--violet),var(--fuchsia));color:#fff;border-color:transparent}
.ctc-range-block{margin-top:16px}
.ctc-range-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:2px}
.ctc-range-head .lbl{font-size:11.5px;font-weight:750;color:var(--ink-2)}
.ctc-range-head .val{font-family:var(--mono);font-size:11.5px;font-weight:800;color:var(--mod-ink);background:var(--mod-soft);border:1px solid color-mix(in srgb,var(--mod) 20%,transparent);padding:2px 9px;border-radius:999px;font-variant-numeric:tabular-nums}
.slider-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;gap:10px}
.slider-head .lbl{font-size:11.5px;font-weight:750;color:var(--ink-2)}
.slider-head .val{font-size:11px;font-weight:800;font-family:var(--mono);color:var(--mod-ink);background:var(--mod-soft);padding:2px 9px;border-radius:999px;font-variant-numeric:tabular-nums;border:1px solid color-mix(in srgb,var(--mod) 20%,transparent)}
.precision-row{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;align-items:center;gap:8px}
.precision-row .step-btn{border:1px solid var(--line-strong);border-radius:10px;background:color-mix(in srgb,var(--surface-solid) 70%,transparent);min-height:36px;font-size:16px;color:var(--ink-2)}
.precision-row .step-btn:hover{background:var(--mod-soft);color:var(--mod-ink);border-color:color-mix(in srgb,var(--mod) 28%,transparent)}
.ctc-fineprint{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.5}
.gate-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}
.gate-actions .btn.primary{flex:1;min-width:190px;justify-content:center;padding:0 20px;font-size:14px;font-weight:800;border-radius:13px;min-height:48px}
.gate-actions .btn{min-height:48px;border-radius:13px}
.gate-note{font-size:10.5px;color:var(--muted);margin-top:15px;line-height:1.55;padding-top:13px;border-top:1px solid var(--line);display:flex;align-items:flex-start;gap:7px}
.gate-note .icon-svg{width:14px;height:14px;color:var(--emerald);margin-top:1px}
.gate-err{color:var(--bad);font-size:11.5px;margin-top:9px;font-weight:750;display:flex;align-items:center;gap:5px}
.trust-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.trust-item{display:flex;align-items:flex-start;gap:7px;padding:9px;border-radius:11px;background:color-mix(in srgb,var(--surface-solid) 52%,transparent);border:1px solid var(--line);font-size:9.5px;color:var(--muted);line-height:1.4}
.trust-item .icon-svg{width:14px;height:14px;color:var(--mod);flex:none;margin-top:1px}
.trust-item b{display:block;font-size:10px;color:var(--ink-2);margin-bottom:1px}
.intake-preview{min-width:0}

/* ---------- charts ---------- */
.donut-wrap{position:relative;width:170px;max-width:100%;margin:4px auto}
.donut-wrap svg{overflow:visible;filter:drop-shadow(0 10px 18px rgba(45,20,100,.12))}
.donut-seg{transition:opacity .18s,stroke-width .18s,filter .18s;cursor:pointer}
.donut-seg.dim{opacity:.24}
.donut-seg.active{stroke-width:18;filter:drop-shadow(0 0 8px currentColor)}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;padding:18px}
.donut-center .dc-lbl{font-size:9px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);line-height:1.3}
.donut-center .dc-val{font-family:var(--mono);font-size:15px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums;color:var(--ink);letter-spacing:-.03em;line-height:1.2}
.donut-center .dc-sub{font-size:9.5px;color:var(--muted);margin-top:1px;line-height:1.3}
.chart-legend{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:6px}
.chart-legend li{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:10px;background:color-mix(in srgb,var(--surface-solid) 48%,transparent);border:1px solid transparent;min-width:0;cursor:pointer;transition:background .15s,border-color .15s,transform .1s}
.chart-legend li:hover,.chart-legend li.active{background:var(--surface-2);border-color:var(--line)}
.chart-legend .dot{width:9px;height:9px;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 14%,transparent)}
.chart-legend .lg{flex:1;min-width:0;font-weight:650;color:var(--ink-2);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart-legend .amt{font-family:var(--mono);font-weight:800;font-variant-numeric:tabular-nums;font-size:11.5px;white-space:nowrap}
.chart-legend .pct{color:var(--muted);font-size:9.5px;min-width:32px;text-align:right;font-weight:750}
.rt-row{margin-bottom:12px}
.rt-row:last-child{margin-bottom:0}
.rt-top{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;margin-bottom:4px;color:var(--ink-2);font-weight:650}
.rt-top .mono{font-weight:800;color:var(--ink)}
.rt-track{height:9px;border-radius:99px;background:var(--surface-2);overflow:hidden;width:100%;border:1px solid var(--line)}
.rt-track>span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--mod),var(--mod-2));box-shadow:0 0 12px var(--mod-glow);transition:width .5s cubic-bezier(.22,.8,.25,1)}
.rt-save{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:11px;border-top:1px dashed var(--line-strong);flex-wrap:wrap}
.rt-save .hint{font-size:10.5px}
.bar-track{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden;width:100%}
.bar-track>span{display:block;height:100%;background:linear-gradient(90deg,var(--mod),var(--mod-2));border-radius:99px}

/* stock chart / mix bar */
.mix-bar{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);gap:2px}
.mix-bar span{display:block;height:100%;min-width:3px;transition:flex-basis .4s}
.mix-legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;margin-top:12px}
.mix-legend .mi{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted);min-width:0}
.mix-legend .mi i{width:7px;height:7px;border-radius:50%;flex:none}
.mix-legend .mi b{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-2);font-weight:750;white-space:nowrap}
.mix-legend .mi span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- tables ---------- */
.table-wrap{overflow-x:auto;border-radius:14px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface-solid) 52%,transparent);-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
th,td{padding:9px 11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:color-mix(in srgb,var(--mod) 7%,var(--surface-solid));font-weight:800;font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);white-space:nowrap;position:sticky;top:0;z-index:1}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--mod) 3%,transparent)}
td .num,th .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.table-compact td,.table-compact th{padding:7px 9px;font-size:11.5px}
tr.total td{font-weight:800;background:var(--mod-soft);color:var(--ink)}
tr.good td{color:var(--good)}
tr.bad td{color:var(--bad)}
td .chip{vertical-align:1px}

/* ---------- traces, notes, details ---------- */
.trace{border:1px solid var(--line-strong);border-radius:12px;background:color-mix(in srgb,var(--surface-solid) 44%,transparent);margin-top:8px;overflow:hidden}
.trace summary{font-size:11px;font-weight:700;color:var(--ink-2);padding:9px 11px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:7px;min-height:38px}
.trace summary::-webkit-details-marker{display:none}
.trace summary::before{content:"";width:0;height:0;border-left:4px solid var(--muted);border-top:3.5px solid transparent;border-bottom:3.5px solid transparent;transition:transform .15s}
.trace[open] summary::before{transform:rotate(90deg)}
.trace-body{padding:8px 11px 11px;font-size:11.5px;border-top:1px solid var(--line)}
.trace-line{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 65%,transparent)}
.trace-line:last-child{border-bottom:0}
.trace-line span:first-child{color:var(--muted)}
.trace-line span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:650;color:var(--ink);white-space:nowrap}
.note-block{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:11.5px;line-height:1.5;margin-top:10px}
.note-block p{margin:0;color:var(--muted);flex:1;min-width:180px}
.conf-legend{display:grid;gap:8px;margin-bottom:14px}
.legend-item{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.legend-item .chip{flex:none}
.legend-item span:last-child{line-height:1.4}

/* ---------- payslip ---------- */
.payslip{background:var(--surface-solid);border:1px solid var(--line);border-radius:20px;padding:clamp(16px,2.4vw,26px);box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.payslip::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--violet),var(--fuchsia),var(--orange))}
.ps-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding-bottom:16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ps-co{font-weight:800;font-size:18px;letter-spacing:-.03em}
.ps-pd{font-size:10.5px;color:var(--muted);margin-top:2px}
.ps-net{text-align:right}
.ps-net-lbl{font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ps-net-val{font-family:var(--mono);font-size:26px;font-weight:800;color:var(--good);font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.ps-cols{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:18px}
@media(max-width:640px){.ps-cols{grid-template-columns:1fr;gap:16px}}
.ps-col-h{font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.ps-cols table td{padding:6px 3px;font-size:12px}
.ps-total td{font-weight:800;border-top:1px solid var(--line-strong);background:var(--surface-2)}
.ps-employer{font-size:10.5px;color:var(--muted);border-top:1px dashed var(--line-strong);margin-top:16px;padding-top:12px;line-height:1.6}
.ps-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}

/* ---------- summary rail ---------- */
.summary-rail{display:none}
.rail-hero{
  position:relative;overflow:hidden;border-radius:20px;padding:18px;color:#fff;
  background:
    radial-gradient(320px 160px at 94% 0%,rgba(251,191,36,.5),transparent 60%),
    radial-gradient(300px 180px at 0% 100%,rgba(56,189,248,.38),transparent 64%),
    linear-gradient(145deg,#3b0764,#6d28d9 48%,#be185d);
  box-shadow:0 20px 44px -22px rgba(109,40,217,.8),inset 0 0 0 1px rgba(255,255,255,.12);
  margin-bottom:10px;
}
.rail-hero::after{content:"";position:absolute;right:-50px;top:-70px;width:170px;height:170px;border-radius:50%;border:1px solid rgba(255,255,255,.18)}
.rail-hero-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:9px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:rgba(255,255,255,.7)}
.live-pill{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.18);font-size:8px;letter-spacing:.06em;color:#fff}
.live-pill i{width:4px;height:4px;border-radius:50%;background:#a7f3d0;display:inline-block}
.rail-hero-value{font-size:clamp(26px,2.6vw,34px);font-weight:800;letter-spacing:-.05em;line-height:1.1;margin-top:8px;font-variant-numeric:tabular-nums}
.rail-hero-sub{font-size:10.5px;color:rgba(255,255,255,.76);margin-top:3px;line-height:1.4}
.rail-meter{height:6px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden;margin-top:13px}
.rail-meter span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#a7f3d0,#67e8f9);box-shadow:0 0 12px rgba(167,243,208,.6)}
.rail-hero-foot{display:flex;align-items:center;justify-content:space-between;font-size:9.5px;color:rgba(255,255,255,.66);margin-top:6px}
.rail-hero-foot b{color:#fff;font-family:var(--mono);font-size:10.5px}
.rail-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.rail-stat{padding:10px 11px;border-radius:13px;background:var(--surface);border:1px solid var(--line);min-width:0}
.rail-stat>span{display:block;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800}
.rail-stat>b{display:block;font-family:var(--mono);font-size:14px;font-weight:800;letter-spacing:-.03em;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-stat>small{display:block;font-size:9px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-winner{display:flex;align-items:flex-start;gap:8px;padding:10px 11px;border-radius:13px;background:var(--mod-soft);border:1px solid color-mix(in srgb,var(--mod) 20%,transparent);font-size:10.5px;color:var(--muted);line-height:1.4;margin-bottom:10px}
.rail-winner .icon-svg{width:15px;height:15px;color:var(--mod-ink);flex:none;margin-top:1px}
.rail-winner b{color:var(--mod-ink);display:block;font-size:11px;margin-bottom:1px}
.rail-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.rail-action{display:flex;align-items:center;gap:6px;padding:8px 9px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:10px;font-weight:700;min-height:38px;transition:background .15s,border-color .15s,color .15s}
.rail-action .icon-svg{width:13px;height:13px;color:var(--mod)}
.rail-action:hover{background:var(--mod-soft);border-color:color-mix(in srgb,var(--mod) 24%,transparent);color:var(--mod-ink)}
.rail-action.wide{grid-column:1/-1}
.rail-note{font-size:9.5px;color:var(--muted);line-height:1.45;text-align:center;margin:0}

/* ---------- sheet ---------- */
.sheet-backdrop{position:fixed;inset:0;z-index:94;background:rgba(9,6,24,.48);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .24s}
.sheet-backdrop.show{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:95;margin-inline:auto;
  width:100%;max-width:740px;
  background:color-mix(in srgb,var(--surface-solid) 96%,transparent);
  border-radius:28px 28px 0 0;
  border:1px solid var(--line);border-bottom:0;
  box-shadow:0 -30px 90px -30px rgba(20,10,50,.5);
  max-height:90vh;overflow-y:auto;
  padding:8px 18px calc(26px + env(safe-area-inset-bottom));
  transform:translateY(103%);
  transition:transform .28s cubic-bezier(.22,.8,.25,1);
  overscroll-behavior:contain;
}
.sheet.open{transform:translateY(0)}
.sheet-handle{width:44px;height:5px;border-radius:99px;background:var(--line-strong);margin:3px auto 9px;cursor:grab;touch-action:none}
.sheet-handle:active{cursor:grabbing}
.sheet-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;touch-action:none}
.sheet-bar h3{font-size:17px;font-weight:800;letter-spacing:-.03em}
.sheet .icon-btn{width:36px;height:36px;border-radius:10px}

/* ---------- command palette ---------- */
.cmd-overlay{position:fixed;inset:0;z-index:130;display:grid;place-items:start center;padding-top:12vh;background:rgba(8,5,22,.42);backdrop-filter:blur(10px) saturate(1.2)}
.cmd-overlay[hidden]{display:none}
.cmd-panel{width:min(620px,calc(100vw - 28px));background:color-mix(in srgb,var(--surface-solid) 94%,transparent);border:1px solid var(--line-strong);border-radius:20px;box-shadow:var(--shadow-lg);overflow:hidden;animation:cmd-in .18s ease-out}
@keyframes cmd-in{from{opacity:0;transform:translateY(-8px) scale(.985)}to{opacity:1;transform:none}}
.cmd-input-row{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line)}
.cmd-input-row .icon-svg{width:19px;height:19px;color:var(--violet);flex:none}
.cmd-input-row input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:15px;font-weight:600;color:var(--ink);padding:4px 0}
.cmd-input-row input::placeholder{color:var(--muted);font-weight:500}
.cmd-input-row kbd,.cmd-foot kbd{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);font:650 10px/1 var(--mono)}
.cmd-list{max-height:52vh;overflow-y:auto;padding:6px}
.cmd-group{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800;padding:9px 10px 4px}
.cmd-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:11px;color:var(--ink-2);font-size:13px;font-weight:650;text-align:left;border:1px solid transparent;min-height:44px}
.cmd-item .icon-svg{width:17px;height:17px;color:var(--mod);flex:none}
.cmd-item .cmd-item-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmd-item .cmd-item-group{font-size:9.5px;color:var(--muted);font-weight:650}
.cmd-item.active{background:var(--mod-soft);border-color:color-mix(in srgb,var(--mod) 22%,transparent);color:var(--mod-ink)}
.cmd-item.active .icon-svg{color:var(--mod-ink)}
.cmd-empty{padding:26px 14px;text-align:center;color:var(--muted);font-size:12.5px}
.cmd-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 14px;border-top:1px solid var(--line);background:var(--surface-2);font-size:9.5px;color:var(--muted);flex-wrap:wrap}
.cmd-foot span{display:inline-flex;align-items:center;gap:4px}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));
  transform:translate(-50%,16px);z-index:140;
  display:flex;align-items:center;gap:8px;
  background:color-mix(in srgb,var(--ink) 92%,transparent);
  color:#fff;padding:10px 16px;border-radius:999px;
  border:1px solid rgba(255,255,255,.14);
  box-shadow:var(--shadow-lg);font-size:12px;font-weight:650;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:92vw;text-align:center;
}
.toast .icon-svg{width:15px;height:15px;color:#6ee7b7;flex:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- scenarios ---------- */
.scenario-list{display:grid;gap:9px;margin-top:6px}
.scenario-card{padding:12px 13px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
.scenario-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.scenario-name{font-weight:800;font-size:13.5px;letter-spacing:-.01em}
.scenario-meta{font-size:10px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px}
.scenario-meta span{display:inline-flex;align-items:center;gap:4px}
.scenario-actions{display:flex;flex-wrap:wrap;gap:5px}
.scenario-actions .btn{min-height:32px;font-size:11px;padding:0 9px}
.scenario-empty{padding:28px 14px;text-align:center;color:var(--muted);font-size:12.5px;border:1px dashed var(--line-strong);border-radius:14px;background:var(--surface-2)}
.scenario-empty .icon-svg{width:28px;height:28px;margin:0 auto 8px;color:var(--violet);opacity:.65}

/* ---------- settings / misc ---------- */
.source-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.source-list li{padding:10px 12px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line);font-size:11.5px;color:var(--muted);line-height:1.5}
.source-list li b{color:var(--ink-2)}
dl{margin:0;display:grid;gap:8px}
dt{font-weight:750;font-size:12px;color:var(--ink-2)}
dd{margin:0 0 6px;font-size:11.5px;color:var(--muted);line-height:1.55}
ul{margin:0;padding-left:18px}
li{margin:0 0 5px;font-size:12px;line-height:1.5}
.section-title+.section-intro{margin-top:8px}
.empty-cta .btn{min-height:44px}

/* ---------- desktop layout ---------- */
@media (min-width:1024px){
  .shell{display:grid;grid-template-columns:258px minmax(0,1fr) 312px;align-items:start;gap:0;padding-bottom:0}
  .sidebar{position:sticky;top:var(--topbar-h);height:calc(100vh - var(--topbar-h));transform:none;box-shadow:none;border-right:1px solid var(--line);backdrop-filter:none;background:color-mix(in srgb,var(--surface-solid) 46%,transparent)}
  .sidebar.open{transform:none}
  .backdrop{display:none}
  .menu-btn{display:none}
  #closeSidebar{display:none}
  .mobile-dock{display:none}
  .dock{display:flex;position:sticky;top:var(--topbar-h);height:calc(100vh - var(--topbar-h));overflow-y:auto;border-left:1px solid var(--line);padding:18px 16px 30px;flex-direction:column;gap:8px;background:color-mix(in srgb,var(--surface-solid) 26%,transparent)}
  .summary-rail{display:block}
  .dock-summary,.dock-tabs{display:none}
  #main{padding:30px 30px 60px;max-width:none;width:100%}
  .section-title{font-size:clamp(30px,2.8vw,40px)}
}
@media (min-width:1500px){
  .shell{grid-template-columns:272px minmax(0,1fr) 340px}
  #main{padding-left:52px;padding-right:52px}
}

/* onboarding is a full-bleed product moment, not a dashboard shell */
.onboarding .sidebar,.onboarding .dock,.onboarding .backdrop,.onboarding .mobile-dock,.onboarding .menu-btn{display:none!important}
.onboarding .shell{display:block;padding-bottom:24px}
.onboarding #main{max-width:1160px;padding-top:clamp(18px,4vh,48px);padding-bottom:40px}
.onboarding .fy-banner{display:none}
.onboarding .topbar{background:color-mix(in srgb,var(--bg) 52%,transparent)}
.onboarding .cmd-btn{display:none}

/* ---------- responsive ---------- */
@media (max-width:1023px){
  .dock{
    display:flex;flex-direction:column;
    position:fixed;left:0;right:0;bottom:0;z-index:75;
    background:color-mix(in srgb,var(--surface-solid) 90%,transparent);
    backdrop-filter:blur(22px) saturate(1.5);
    -webkit-backdrop-filter:blur(22px) saturate(1.5);
    border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
    box-shadow:0 -18px 40px -26px rgba(40,20,90,.35);
  }
  .mobile-dock{display:none}
  .topbar{min-height:60px;padding:8px 12px;gap:7px}
  .brand-mark{width:36px;height:36px;border-radius:12px}
  .brand-mark svg{width:20px;height:20px}
  .brand-name{font-size:15px}
  .brand-sub{display:none}
  .cmd-btn{width:38px;padding:0;justify-content:center;border-radius:11px}
  .cmd-btn .cmd-btn-label,.cmd-btn kbd{display:none}
  .compact-select{max-width:110px;font-size:11.5px;padding-left:9px;background-position:calc(100% - 13px) 16px,calc(100% - 8px) 16px}
  .regime-toggle button{padding:0 10px;font-size:11px}
  .icon-btn{width:38px;height:38px}
  .menu-btn{display:inline-flex}
  #main{padding:18px 30px 120px}
  .section-title{font-size:clamp(25px,6.2vw,34px)}
  .module-head{gap:10px}
  .module-icon{width:38px;height:38px;border-radius:12px}
  .module-icon .icon-svg{width:19px;height:19px}
  .page-head{align-items:flex-start;gap:10px;margin-bottom:15px}
  .page-actions{width:100%}
  .grid{gap:12px}
  .card{padding:16px;border-radius:18px;margin-bottom:12px}
  .pay-hero{grid-template-columns:1fr;padding:20px;border-radius:22px;gap:14px}
  .ph-value{font-size:clamp(36px,10vw,52px)}
  .pay-hero-side{padding:13px}
  .result-card{padding:20px;border-radius:22px;position:static}
  .gate-wrap{gap:14px}
  .gate-card{padding:20px;border-radius:22px}
  .trust-row{grid-template-columns:1fr}
  .trust-item{align-items:center}
  .split-grid{grid-template-columns:1fr}
  .mix-legend{grid-template-columns:1fr 1fr}
  .table-wrap{margin-left:-2px;margin-right:-2px}
  .sheet{max-height:92vh;padding-left:14px;padding-right:14px}
  .toast{bottom:calc(96px + env(safe-area-inset-bottom))}
}
@media (max-width:620px){
  #main{padding-left:22px;padding-right:22px}
  .topbar .regime-toggle{display:none}
  .compact-select{max-width:104px}
  .brand-name{font-size:14px}
  .section-intro{font-size:12.5px}
  .grid-4{grid-template-columns:1fr 1fr}
  .kpi{padding:12px}
  .kpi .val{font-size:18px}
  .kpi .lbl{font-size:8.5px}
  .kpi .sub{font-size:10px}
  .kpi .kpi-ico{width:24px;height:24px;right:9px;top:9px}
  .card h3{font-size:14px}
  .gate-card h2{font-size:25px}
  .ctc-box{padding:12px 13px;border-radius:15px}
  .ctc-box input{font-size:clamp(26px,8vw,36px)}
  .ctc-box .suffix{display:none}
  .gate-actions .btn.primary{min-width:100%;flex:1 1 100%}
  .gate-actions .btn{flex:1}
  .range-scale{font-size:8.5px}
  .ps-net{text-align:left}
  .ps-head{gap:10px}
  .scenario-actions .btn{flex:1}
  .chart-legend .lg{font-size:10.5px}
  .chart-legend .amt{font-size:10.5px}
  .rail-stats{grid-template-columns:1fr 1fr}
}
@media (max-width:430px){
  .grid-4{grid-template-columns:1fr}
  .brand-text{max-width:118px}
  .brand-name{font-size:13px;overflow:hidden;text-overflow:ellipsis}
  .compact-select{max-width:92px;font-size:10.5px}
  .dock-tabs button{min-width:52px;font-size:8.5px}
  .trust-row{grid-template-columns:1fr}
  .mix-legend{grid-template-columns:1fr}
}

/* ---------- tone defaults ---------- */
/* These keep components readable even when they sit outside a [data-tone] block. */
:root{
  --mod:#8b5cf6;--mod-2:#c084fc;--mod-soft:#f1eaff;
  --mod-mist:rgba(139,92,246,.16);--mod-glow:rgba(139,92,246,.32);--mod-ink:#6d28d9;
}
[data-theme="dark"]{
  --mod:#a78bfa;--mod-2:#c4b5fd;--mod-soft:#241a4a;
  --mod-mist:rgba(167,139,250,.22);--mod-glow:rgba(167,139,250,.4);--mod-ink:#ddd6fe;
}
[hidden]{display:none!important}

/* ---------- gradient summary panel ---------- */
.panel-hero{
  position:relative;overflow:hidden;border-radius:26px;padding:24px;color:#fff;margin-bottom:16px;
  background:
    radial-gradient(520px 240px at 92% 0%,color-mix(in srgb,var(--mod-2) 58%,transparent),transparent 62%),
    radial-gradient(420px 220px at 0% 100%,rgba(56,189,248,.3),transparent 62%),
    linear-gradient(140deg,#191534,#3b1d7a 48%,#701a75);
  box-shadow:0 26px 60px -30px rgba(76,29,149,.65),inset 0 0 0 1px rgba(255,255,255,.12);
}
.panel-hero::after{content:"";position:absolute;right:-80px;top:-110px;width:280px;height:280px;border-radius:50%;border:1px solid rgba(255,255,255,.16);box-shadow:0 0 0 30px rgba(255,255,255,.04);pointer-events:none}
.panel-hero-top{position:relative;z-index:1;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.panel-hero .ph-value{font-size:clamp(34px,5vw,54px);margin:7px 0 5px}
.panel-hero .ph-sub{color:rgba(255,255,255,.82);font-size:12.5px;line-height:1.5;max-width:56ch}
.panel-hero .chip-row{max-width:100%}
.panel-hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:18px}
.panel-hero-cell{padding:9px 10px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);min-width:0}
.panel-hero-cell span{display:block;font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.62);font-weight:800}
.panel-hero-cell b{display:block;font-family:var(--mono);font-size:12.5px;font-weight:800;color:#fff;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- inline notice ---------- */
.notice{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;border-radius:12px;border:1px solid color-mix(in srgb,var(--mod) 22%,transparent);background:color-mix(in srgb,var(--mod) 8%,var(--surface-solid));font-size:11.5px;line-height:1.5;color:var(--ink-2)}
.notice .icon-svg{width:15px;height:15px;color:var(--mod-ink);flex:none;margin-top:1px}
.notice b{color:var(--ink)}

/* ---------- mini stats ---------- */
.mini-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;margin-top:10px}
.mini-stat{padding:9px 10px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line);min-width:0}
.mini-stat span{display:block;font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.mini-stat b{display:block;font-family:var(--mono);font-size:13px;font-weight:800;margin-top:2px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- timeline chart ---------- */
.timeline-chart{display:flex;align-items:flex-end;gap:5px;height:150px;padding:10px 2px 0;border-bottom:1px solid var(--line)}
.tb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0;height:100%}
.tb-bar{width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,var(--mod-2),var(--mod));min-height:4px;transition:height .4s;box-shadow:0 2px 8px -3px var(--mod-glow)}
.tb-bar.bonus{background:linear-gradient(180deg,#fb923c,#f43f5e);box-shadow:0 2px 8px -3px rgba(244,63,94,.5)}
.tb-lbl{font-size:8.5px;color:var(--muted);font-weight:750;line-height:1}
.tb-val{font-size:8px;color:var(--muted);font-family:var(--mono);white-space:nowrap;opacity:0;transition:opacity .15s}
.tb:hover .tb-val{opacity:1}

/* ---------- verdict ---------- */
.verdict{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;border:1px solid color-mix(in srgb,var(--mod) 24%,transparent);background:linear-gradient(120deg,var(--mod-soft),var(--surface-solid));margin-bottom:14px}
.verdict .v-ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,var(--mod),var(--mod-2));color:#fff;flex:none;box-shadow:0 10px 22px -12px var(--mod-glow)}
.verdict b{display:block;font-size:14px;letter-spacing:-.02em;color:var(--ink)}
.verdict span{display:block;font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:2px}

/* ---------- recap rows ---------- */
.recap{display:grid}
.recap-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.recap-row:last-child{border-bottom:0}
.recap-row span{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:7px;min-width:0;flex:1 1 auto;line-height:1.35}
.recap-row b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap;font-weight:750;flex:0 0 auto;text-align:right}
.recap-row.total{border-top:1px solid var(--line-strong);border-bottom:0;padding-top:11px;margin-top:3px}
.recap-row.total b{font-size:15.5px;font-weight:800}
.recap-row.pos b{color:var(--good)}
.recap-row.neg b{color:var(--bad)}

/* ---------- empty inline ---------- */
.empty-inline{display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:13px;border:1px dashed var(--line-strong);background:var(--surface-2);color:var(--muted);font-size:12px;line-height:1.5}
.empty-inline .icon-svg{width:18px;height:18px;color:var(--mod);flex:none}

/* ---------- intake fine print ---------- */
.ctc-fineprint{font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.5}
.gate-err[hidden]{display:none}

/* ---------- responsive extras ---------- */
@media(max-width:760px){
  .panel-hero{padding:18px;border-radius:22px}
  .panel-hero-grid{grid-template-columns:1fr 1fr}
  .panel-hero .ph-value{font-size:clamp(30px,8vw,42px)}
  .verdict{align-items:flex-start}
}
@media(max-width:620px){
  .timeline-chart{height:118px;gap:3px}
  .tb-val{display:none}
  .panel-hero-grid{gap:6px}
  .panel-hero-cell{padding:8px}
  .panel-hero-cell b{font-size:11.5px}
}
@media(max-width:430px){
  .panel-hero-grid{grid-template-columns:1fr 1fr}
}

/* ---------- print: flat panels ---------- */
@media print{
  .panel-hero{background:#fff!important;color:#000!important;box-shadow:none!important;border:1px solid #999!important}
  .panel-hero *{color:#000!important;text-shadow:none!important}
  .panel-hero-cell{border:1px solid #bbb!important;background:#fff!important}
  .timeline-chart{display:none}
}

/* ---------- print ---------- */
#printRoot{display:none}
@media print{
  body{background:#fff!important;color:#000;font-size:11pt}
  body::before,body::after,.aurora,.bg-grid,.topbar,.sidebar,.mobile-dock,.backdrop,.toast,.sheet,.sheet-backdrop,.dock,.cmd-overlay,.no-print,.page-actions,.rule-strip{display:none!important}
  .shell{display:block!important}
  #main{padding:0;max-width:none}
  #printRoot{display:block!important}
  .card,.payslip,.kpi{box-shadow:none!important;border:1px solid #999!important;background:#fff!important;break-inside:avoid;backdrop-filter:none!important}
  .card::before,.card::after,.payslip::before{display:none!important}
  .table-wrap{overflow:visible;border:0}
  table{font-size:9.5pt}
  th{background:#f2f2f2!important;color:#000!important}
  tr.total td{background:#eee!important}
  .pay-hero,.result-card,.rail-hero{background:#fff!important;color:#000!important;box-shadow:none!important;border:1px solid #999!important}
  .pay-hero *,.result-card *,.rail-hero *{color:#000!important;text-shadow:none!important}
  @page{size:A4;margin:12mm}
}

/* ---------- footer ---------- */
/* Bookends the topbar: the same gradient hairline that closes the top opens
   the footer, so the app reads as one framed surface. */
.app-foot{
  margin-top:30px;padding-top:16px;position:relative;
  display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;
  color:var(--muted);font-size:11.5px;
}
